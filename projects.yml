projects:
  - id: agent-ai
    published: true
    name: {en: Agent AI, zh: Agent AI（文档问答助手）}
    date: {en: '2026 — ongoing', zh: '2026年 — 持续开发'}
    region: ny
    type: personal
    tech: React, Node.js, LangChain, MCP, SerpAPI
    keywords: [RAG, AI agent, 文档问答, 语音, retrieval]
    summary:
      en: A conversational application presenting document-based answers alongside answers informed by web search.
      zh: 分别展示基于文档及网络搜索回答的对话应用。
    background:
      en: The project explores two information sources in one interface. Uploaded PDFs provide local context, while a separate MCP search tool retrieves current web information. The two answer streams remain visible separately.
      zh: 项目在同一界面中探索两类信息来源：上传 PDF 提供本地上下文，独立 MCP 搜索工具获取网络信息，两种回答分别展示。
    work:
      - en: Built the React interface and Express endpoints for PDF uploads and questions.
        zh: 构建 React 界面及处理 PDF 上传与问题的 Express 接口。
      - en: Loaded and split PDF text, embedded the chunks into an in-memory vector store, and used retrieved text as context for answering.
        zh: 加载并切分 PDF 文本，将文本块嵌入内存向量存储，使用检索文本作为回答上下文。
      - en: Connected a reusable MCP client to a SerpAPI search server and added speech recognition and text-to-speech interaction.
        zh: 将可复用 MCP 客户端连接到 SerpAPI 搜索服务，并加入语音识别与文字转语音交互。
    boundary:
      en: The current prototype uses a shared uploaded-file path and rebuilds its document embeddings during a question request. Public multi-user access and source citations are not yet implemented.
      zh: 当前原型共享上传文件路径，并在问答请求中重新构建文档嵌入，尚未实现公共多用户访问及来源引用展示。

  - id: social-ai
    published: true
    name: {en: SocialAI, zh: SocialAI（AI 社交平台）}
    date: {en: 'Dec 2025 – Mar 2026; subsequent maintenance', zh: '2025年12月 – 2026年3月；后续持续维护'}
    region: ny
    type: personal
    tech: React, Go, Elasticsearch, Google Cloud, Docker
    keywords: [search, full-stack, image generation, 搜索, 图像生成]
    summary:
      en: A full-stack social application combining searchable posts with AI-assisted image creation.
      zh: 将帖子搜索与 AI 辅助图像创作结合的全栈社交应用。
    background:
      en: SocialAI brings content creation and discovery together. Its React interface connects to a Go service, with Elasticsearch for search and cloud storage for uploaded media.
      zh: SocialAI 将内容创作与发现结合起来。React 界面连接 Go 服务，使用 Elasticsearch 搜索及云存储保存媒体。
    work:
      - en: Implemented frontend and backend flows for users, posts, and content search.
        zh: 实现用户、帖子与内容搜索相关的前后端流程。
      - en: Integrated image generation behind provider interfaces; the current repository includes OpenAI and Gemini implementations and related tests.
        zh: 通过服务接口接入图像生成；当前仓库包含 OpenAI、Gemini 实现及相关测试。
      - en: Maintained a Docker Compose development stack and Google Cloud deployment configuration.
        zh: 维护 Docker Compose 开发环境与 Google Cloud 部署配置。

  - id: online-ordering
    published: true
    name: {en: Online Food Ordering, zh: Online Food Ordering（在线订餐系统）}
    date: {en: 'Dec 2025 – Feb 2026', zh: '2025年12月 – 2026年2月'}
    region: ny
