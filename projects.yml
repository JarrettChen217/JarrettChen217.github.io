  - id: agent-ai
    published: true
    name: {en: Agent AI, zh: Agent AI（文档问答助手）}
    date: {en: '2026 — ongoing', zh: '2026年 — 持续开发'}
    region: ny
    type: personal
    tech: React, Node.js, LangChain, MCP, SerpAPI
    keywords: [RAG, AI agent, 文档问答, 语音, retrieval]
    summary:
      en: A personal study prototype for asking questions about a PDF and seeing how an answer drawn from the notes compares with one drawn from the web.
      zh: 为复习做的个人问答原型。上传一份学习笔记，再针对同一问题分别查看依据笔记和网页资料生成的回答。
    background:
      en: I wanted a way to revise for finals with my own notes. With a physics handout open, I might remember a conclusion but forget the conditions under which it holds. A plausible explanation is hard to trust if I cannot tell whether the handout supports it. I built this personal prototype in a course repository to try grounding the answer in passages from the PDF. The web answer appears alongside it, so I can see what a separate search brings to the question.
      zh: 期末复习时，我想直接拿自己的 PDF 笔记来提问。比如翻物理讲义，我可能记得一个结论，却忘了它在什么条件下才成立。回答即使听起来很像那么回事，我还是想知道讲义里有没有依据。我在课程仓库里做了这个个人原型，希望先找回笔记中的相关段落，再让模型据此回答，减少没有依据的猜测。同一个问题还会单独拿去搜网页，方便比较两种来源各自能说清什么。
    workHeading: {en: My contribution, zh: 我的贡献}
    work:
      - en: My goal was to get a question from upload to answer. I wrote the MCP search server that exposes SerpAPI as a tool. Express can pass the user’s question to that tool over standard input and output, then use the returned web results to generate a separate answer.
        zh: 我当时想跑通从上传文件到提问、回答的流程。我编写了 MCP 搜索服务器，把 SerpAPI 封装成工具。Express 可以通过标准输入输出把问题交给它，再用返回的网页结果单独生成回答。
    play:
      url: play/agent-ai-retrieval/index.html
      label: {en: Explore the 12 retrieval questions, zh: 查看 12 道题的检索结果}
    sectionOrder: [background, journey, contributions, process, scope]
    journeyHeading: {en: Design decisions, zh: 设计取舍}
    journey:
      - title:
          en: "Which source should answer a study question?"
          zh: "一道复习题，该用哪份资料回答？"
        body:
          en: "When I revise for an exam, I want to know what my lecturer said and what I can find elsewhere. I kept the PDF and web answers side by side. Both use an OpenAI chat model, but each receives different evidence. On the PDF side, an embedding model first finds passages with a similar meaning. On the web side, the MCP search server I wrote sends the question to a search tool. I can then read each answer against the material that went into it."
          zh: "期末复习时，我既想知道老师在讲义里怎么讲，也想看看其他资料怎么解释。所以我把讲义回答和网页回答并排放在页面上。两边都用 OpenAI 对话模型整理答案，给它的依据各不相同。讲义这边先用嵌入模型找语义相近的段落；网页这边由我编写的 MCP 搜索服务把同一道题交给搜索工具。读答案时，我能分清它各自依据哪一份材料。"
      - title:
          en: "What would justify changing the embedding model?"
          zh: "有什么证据值得我换一个嵌入模型？"
        body:
          en: "I compared the local MiniLM baseline with text-embedding-3-small and text-embedding-ada-002 on the same twelve physics questions. At four passages per question, all three found every marked passage, although their rankings differed. That left me with a more useful question than which model ranked first overall. When the notes said nothing about copper wire resistance, all three still filled four slots. For a study assistant, recognizing that gap matters as much as finding a passage when one exists."
          zh: "我用同一组十二道物理题，对照了本地 MiniLM、text-embedding-3-small 和 text-embedding-ada-002。每题取四段时，三者都找齐了预先标出的依据，段落的先后次序却有差别。有一道题问铜线电阻，笔记里根本没有答案，三个模型还是都交出了四段。对复习助手来说，这个例子比选出一个总分第一更有意义：找得到依据时要找全，找不到时也要能提醒我。"
      - title:
          en: "What still needs checking after retrieval?"
          zh: "找齐依据以后，还要检查什么？"
        body:
          en: "The prototype builds an in-memory index for the question. That kept the course setup small, at the cost of embedding the notes again on a later question. I also checked an actual answer. The document and web replies both explained how mass affects the oscillators, yet both omitted the small-angle condition on the pendulum formula. Passage recall and the accuracy of the final explanation need separate checks."
          zh: "原型在内存里建索引，课程演示少了一项需要部署的服务，代价是下次提问还要重新为讲义计算嵌入。我也核对了实际答案：讲义和网页两路都解释了质量怎样影响振子的周期，却都漏掉了单摆公式的「小角度」前提。检索有没有找全、回答有没有把条件讲全，需要分开检查。"
    process:
      kicker: {en: Document and web search, zh: 文档检索与网页搜索}
      heading: {en: One question and two sources, zh: 一个问题，两种资料来源}
      intro:
        en: Follow a question through the main implementation, check which physics passages retrieval brings back, then see what happened in an earlier browser run.
        zh: 先看两路资料怎样进入模型，再用物理笔记检验段落检索，最后回看演示分支的一次浏览器记录。
      stages:
        - id: study-question
          label: {en: From the study notes, zh: 从复习笔记出发}
          title: {en: Does adding mass change the period?, zh: 增加质量，周期就一定变长吗？}
          body:
            en: Compare a small-angle pendulum with a cart on a spring. This question needs two passages from the physics notes. In the recorded retrieval trial, the pendulum passage ranked first and the spring passage second.
            zh: 把小角度单摆和弹簧小车放在一起比较，这道题需要笔记里两处不同的依据。本地检索试跑中，单摆段落排第一，弹簧小车排第二。
          gallery:
            - src: assets/projects/agent-ai/study-question.webp
              thumbnail: assets/projects/agent-ai/study-question-thumb.webp
              width: 1012
              height: 553
              thumbnailWidth: 640
              alt: {en: Physics question beside the expanded pendulum and spring passages, zh: 左侧为复习题，右侧展开了单摆与弹簧振子两段笔记原文}
              caption: {en: Q08 in the local MiniLM retrieval replay. Both highlighted passages match the reference labels., zh: 本地 MiniLM 检索回放第 8 题。展开的两段原文都命中了预先标注的依据。}
        - id: architecture
          label: {en: System architecture, zh: 系统架构}
          title: {en: What each answer can draw on, zh: 两个回答各自依据什么}
          body:
            en: The main implementation extracts the PDF’s text layer and splits it into passages of up to 500 characters with zero overlap. In a check using two visually identical versions of a one-page physics note, the PDF loader and splitter produced one passage from selectable text and zero from an image-only scan. A scan needs OCR first. For each question, LangChain builds an in-memory vector index and retrieves passages to send with the question. The prompt asks the model to say when it does not know. The separate web path supplies the same question and the results from the MCP search tool.
            zh: 主分支提取 PDF 文字层，每块最多 500 个字符，相邻块不重叠。拿外观相同的一页物理笔记测试，有可选文字的 PDF 提取并切出一段，纯图片版本为零段。所以只有扫描图像的讲义需要先做文字识别。每次提问时，LangChain 建立内存向量索引，把检索到的段落连同问题交给模型；提示词要求模型在无法回答时说不知道。网页一路则把同一个问题和 MCP 搜索工具返回的资料交给模型。
          gallery:
            - src: assets/projects/agent-ai/architecture.webp
              thumbnail: assets/projects/agent-ai/architecture-thumb.webp
              width: 1330
              height: 2029
              thumbnailWidth: 660
              englishImage:
                src: assets/projects/agent-ai/architecture-en.webp
                thumbnail: assets/projects/agent-ai/architecture-en-thumb.webp
                width: 1330
                height: 1808
                thumbnailWidth: 660
              alt:
                en: React, Express, PDF retrieval and the MCP web-search service
                zh: React、Express、PDF 检索和 MCP 网页搜索服务
              caption:
                en: Both paths start with the same question. The document path retrieves passages from the uploaded notes, while the web path retrieves search results.
                zh: 两路从同一句提问出发。文档一路检索笔记中的段落，网页一路获取搜索结果。
        - id: sequence
          label: {en: Request sequence, zh: 请求时序}
          title: {en: From Ask to the two answer fields, zh: 从点击 Ask 到两个回答区}
          body:
            en: In the main branch, Express processes the document question first, then invokes the web search with the same question. After both steps succeed, the response carries ragAnswer and mcpAnswer back to React.
            zh: 在主分支中，Express 先处理文档问答，再用同一问题调用网页搜索。两步成功后，接口用 ragAnswer 和 mcpAnswer 两个字段把结果交给 React。
          gallery:
            - src: assets/projects/agent-ai/sequence.webp
              thumbnail: assets/projects/agent-ai/sequence-thumb.webp
              width: 1330
              height: 1299
              thumbnailWidth: 660
              englishImage:
                src: assets/projects/agent-ai/sequence-en.webp
                thumbnail: assets/projects/agent-ai/sequence-en-thumb.webp
                width: 1330
                height: 1476
                thumbnailWidth: 660
              alt:
                en: Sequence diagram of the successful main-branch request
                zh: 主分支成功路径的 UML 时序图
              caption:
                en: The sequence follows the source code. The browser run below used a separate demo branch.
                zh: 时序图按主分支源码绘制。下方实机画面来自单独的演示分支。
        - id: retrieval-evaluation
          label: {en: Physics notes · Retrieval check, zh: 物理笔记 · 检索评测}
          title: {en: Did the search find the passages needed to answer?, zh: 检索找回了解题所需的段落吗？}
          body:
            en: For this portfolio check, twelve original physics passages were paired with twelve questions. Reference passages were marked before the run. Two questions needed two passages each, and one had no supporting passage. The PDF loader, splitter and in-memory store followed the project code. The first OpenAI call returned HTTP 401, so the initial trial used local MiniLM embeddings. After the credential was updated, the same questions ran against both OpenAI configurations, text-embedding-3-small (Docker demo) and text-embedding-ada-002 (main default). All three runs used the same 12 passages and returned four per question.
            zh: 这次为作品集准备了十二段原创物理笔记和十二道题，在运行前标出每题需要的原文。其中两题各需两段，有一题在笔记中找不到依据。PDF 提取、切分和内存向量库沿用项目实现。首次 OpenAI 请求返回 HTTP 401，当时单独用本地 MiniLM 完成基线试跑。更新凭据后，同一组题分别用 Docker 演示的 text-embedding-3-small 和主分支默认的 text-embedding-ada-002 重跑。三轮实际切出的 12 段完全一致，每题均取前四段。
          findings:
            - en: One question asks how adding mass affects a small-angle pendulum and a cart on a spring. The search found both required passages. The pendulum passage says the bob’s mass leaves its period unchanged. The spring passage says the period grows with the square root of the cart’s mass at fixed stiffness.
              zh: 有一题问，增加质量对小角度单摆和弹簧小车的周期分别有什么影响。前四段里找到了两处依据：单摆一段写明摆锤质量不改变周期，弹簧一段则说明劲度不变时，周期随小车质量的平方根增大。
            - en: Across the twelve questions, 13 of the 48 retrieved question–passage pairs were relevant (precision@4, 27.08%). All 13 marked pairs appeared in the results (micro recall@4, 100%). With just 13 relevant pairs and 48 slots to fill, 27.08% is the highest possible precision on this set. Across all 144 pairs, 109 agreed with the labels (75.69% pairwise accuracy).
              zh: 十二题共返回 48 个「问题 × 段落」配对，13 个与题目相关，前四条的精确率为 27.08%。预先标记的 13 个相关配对全部被找到，汇总召回率为 100%。由于总共只有 13 个相关配对，而返回位置固定有 48 个，27.08% 已是这组题在该设置下的精确率上限。全部 144 个配对中判断与标注一致的有 109 个，配对准确率为 75.69%。
            - en: Asked how temperature changes a copper wire’s resistance, the search still returned four passages, including one about a series circuit. None covered the question. This run scored only the selected passages. It produced no model answers from which to measure answer correctness or hallucinations.
              zh: 另一题问温度怎样影响铜线电阻，笔记没有涉及。检索仍返回了串联电路等四段，均无法回答这道题。这次实验只对照了段落选择，没有生成答案，因而也无法据此判断答题正确率或幻觉是否减少。
          gallery:
            - src: assets/projects/agent-ai/retrieval-matrix.webp
              thumbnail: assets/projects/agent-ai/retrieval-matrix-thumb.webp
              width: 1100
              height: 736
              thumbnailWidth: 640
              englishImage:
                src: assets/projects/agent-ai/retrieval-matrix-en.webp
                thumbnail: assets/projects/agent-ai/retrieval-matrix-en-thumb.webp
                width: 1100
                height: 675
                thumbnailWidth: 640
              alt:
                en: Retrieval matrix for 144 question–passage pairs. Retrieved and relevant 13, retrieved and unrelated 35, missed relevant 0, correctly excluded 96.
                zh: 144 个问题与段落配对的检索四格图。找回相关段落 13 对，带入无关段落 35 对，漏掉相关段落 0 对，正确排除无关段落 96 对。
              caption:
                en: All three runs gave the same four counts. For each OpenAI run, 11 of the 12 ranked lists differed from MiniLM. Recomputing cosine similarities from the returned vectors reproduced every top-four list.
                zh: 三轮的四格计数相同。两次 OpenAI 重跑与 MiniLM 分别对照，各有 11 道题的排序列表发生变化。用返回的向量重新计算余弦相似度，逐题都复现了前四段的顺序。
        - id: walkthrough
          label: {en: Browser walkthrough, zh: 浏览器实测}
          title: {en: How did the two answers compare?, zh: 同一题，两路回答说了什么？}
          body:
            en: In Chrome I uploaded the twelve-page physics notes and asked how adding mass affects each oscillator. Both panels returned an answer. The document answer matched the notes on mass dependence, and the web answer included both period formulas and links to its sources. The notes qualify the pendulum formula as a small-angle result. Neither answer mentioned that condition.
            zh: 在 Chrome 上传十二页物理笔记，再问增加质量会怎样影响两种振子的周期。文档回答与笔记对质量的判断一致；网页回答还列出了两个周期公式及来源链接。回头核对讲义，单摆一节明确写了「小角度」，两路回答都漏掉了这个适用条件。
          gallery:
            - src: assets/projects/agent-ai/physics-answers.webp
              thumbnail: assets/projects/agent-ai/physics-answers-thumb.webp
              width: 908
              height: 498
              thumbnailWidth: 640
              alt:
                en: One physics question followed by the document answer in blue and the web answer in green
                zh: 同一物理题下方，蓝色区域为文档回答，绿色区域为附来源的网页回答
              caption:
                en: Live answers from the local Docker demo branch, developed with a coding agent. PDF upload returned HTTP 201 and the question returned HTTP 200.
                zh: 与编码助手共同完成的本地 Docker 演示分支实录。PDF 上传返回 HTTP 201，问答返回 HTTP 200。
    boundary:
      en: The main prototype uses a shared upload path and rebuilds its in-memory document index with each question.
      zh: 主分支原型使用共享上传路径，每次提问都会重建文档的内存索引。

  - id: social-ai
    published: true
    name: {en: SocialAI, zh: SocialAI（AI 社交平台）}
    date: {en: Dec 2025 – Mar 2026 · Maintenance in Jun 2026, zh: 2025年12月 – 2026年3月 · 2026年6月维护}
    region: ny
    type: academic
    tech: React, Go, Elasticsearch, Google Cloud Storage, Docker
    keywords: [search, keyword, author, image generation, 搜索, 关键词, 作者, 图像生成]
    summary:
      en: Describe a reaction image to go with a post, preview it, and choose whether to publish. To find an image someone has already posted, search Collection for a word you remember.
      zh: 想给帖子配张表情图，可以用一句话描述画面，预览后再决定是否发布。想找回看过的配图，也可以在 Collection 里搜一个记得的词。
    background:
      en: People often know exactly what they want to say but cannot think of the right reaction image. Sometimes they can picture the meme and still cannot find it. Take “Finally finished.” A cat slumped over a keyboard adds something the words leave open — exhaustion and relief at the same time. SocialAI explores that idea in Create, where the author describes a scene and decides whether the generated preview fits the post. Collection addresses a different moment. Someone looking for a garden bridge photo can find it again by searching for “bridge” in the post text.
      zh: 发帖时，常常已经知道自己要说什么，却想不到哪张表情包最贴切。有时脑子里明明有那张图，翻了半天也找不到。比如一句「终于写完了」，配上一只瘫在键盘上的猫，读者就能体会到那种累得够呛、又松了口气的心情。在 SocialAI 的 Create 页面，发帖的人可以把想到的画面描述出来，看过生成的预览再决定是否发布。Collection 用在另一个场景：以前看过一张花园小桥的配图，只要记得帖子里写过 bridge，就能用这个词找回来。
    workHeading: {en: My contribution during the course, zh: 我在课程项目中的工作}
    work:
      - en: I wrote the Go endpoints for creating and searching posts from the React app and indexed the posts in Elasticsearch so they could be retrieved by keyword or author.
        zh: 我为 React 应用编写了发帖和搜索的 Go 接口，并将帖子索引到 Elasticsearch，支持按正文关键词或作者检索。
    sectionOrder: [background, journey, contributions, process]
    journeyHeading: {en: Design decisions, zh: 设计取舍}
    journey:
      - title:
          en: "Why use the search index as the post store?"
          zh: "为什么直接把帖子存在搜索索引里？"
        body:
          en: "The course app needed to answer two everyday questions: which posts mention “bridge”, and what has this author posted? Each post fit in one document with its text, author and media URL. I used Elasticsearch for both storage and search. Go writes the document directly to the post index and queries its message or user field. That kept the prototype small: there was no separate SQL post table to keep in sync. It also made the index essential. If it is unavailable, the app cannot look up posts, even when the photos are still in Cloud Storage."
          zh: "课程原型里，读者最常问的是两件事：哪些帖子提到了 bridge？这个人发过什么？一篇帖子的正文、作者和媒体地址就能放进一份文档，这两种查询也用不着跨表关联。所以我让 Elasticsearch 同时负责存帖和搜帖：Go 把文档直接写进帖子索引，搜索时按 message 字段查正文，或按 user 字段查作者。这样省去了维护 SQL 帖子表、再把变更同步到索引的工作。代价是帖子查询依赖这个索引；即使照片还在对象存储里，索引不可用时，页面也找不回对应的帖子。"
      - title:
          en: "Where does the photo live?"
          zh: "帖子找到以后，照片从哪里来？"
        body:
          en: "A search result includes the media URL. React loads the photo from Google Cloud Storage, so the search response can stay small. Splitting the file from the post has a cost when publishing: Go uploads the file before writing the index entry. If that second write fails, the photo can exist without a searchable post."
          zh: "搜索结果里带着媒体地址，React 据此向 Google Cloud Storage 加载照片，搜索响应只需传回帖子信息。文件和帖子分开存，也留下了一个发布时要处理的问题：Go 先上传照片，再写入索引。如果第二步失败，照片已经存好了，却还没有能搜到的帖子。"
      - title:
          en: "Who checks the reader’s identity?"
          zh: "用户带着令牌，谁来核验身份？"
        body:
          en: "React sends a bearer token with a protected search request. The Go middleware verifies the JWT before the handler runs. This gives the API a way to check identity on each request while the browser handles presenting the token. Loading the image is a separate request to the media URL. A search token and permission to read a storage object are two different decisions."
          zh: "React 向受保护的搜索接口发请求时会带上 Bearer 令牌。Go 中间件先核验 JWT，请求才进入搜索处理函数。浏览器负责出示令牌，身份是否可信仍由服务端判断。随后浏览器按媒体地址取图，是另一次请求；搜索接口认可用户身份，与对象存储是否允许读取那张图，是两件事。"
      - title:
          en: "How did image generation change providers?"
          zh: "为什么把生图模型做成可替换的？"
        body:
          en: "I first deployed image generation with DALL·E, then tried Google’s Nano Banana. In the later portfolio run, I used the OpenAI model configured as gpt-image-2.6-sunburst to generate the cat pictured below. Across those changes, the author’s decision stayed the same: describe a scene, inspect the preview, then decide whether to post. In June 2026, with help from a coding agent, I designed and checked a Go provider interface so that changing the configured provider would preserve that interaction. I also checked invalid prompts and provider errors."
          zh: "最早部署生图时，我用的是 DALL·E，后来试过 Google 的 Nano Banana。这次复现时，我用配置名为 gpt-image-2.6-sunburst 的 OpenAI 模型，生成了下方截图里趴在键盘上的猫。换了几次模型，发帖的人要做的决定始终一样：描述画面，看过预览，再决定发不发。2026 年 6 月维护时，我在编码助手协助下设计并验证了 Go 的生图接口，让后台能通过配置切换提供方，前端仍沿用这套操作。我也检查了提示词无效和提供方报错时的处理。"
    process:
      kicker: {en: Walkthrough, zh: 操作演示}
      heading: {en: Create a reaction image and find a saved photo, zh: 生成一张表情包，再找回一张配图}
      intro:
        en: In Create, I described the feeling of finishing an assignment and opened the generated image. In a separate Collection demo, I searched three sample posts for a photo I remembered.
        zh: 在 Create 里，我把写完作业时的心情描述成一个画面，生成后点开看效果。另一次 Collection 演示则用了三条示例帖子，试着用记得的关键词找回一张照片。
      stages:
        - id: create
          label: {en: Create, zh: 创作}
          title: {en: Give “Finally finished” a face, zh: 给「终于写完了」配张图}
          body:
            en: I pictured a tired cat resting on a keyboard beside its finished homework. I entered that scene in Create, then opened the preview to see whether the picture conveyed the relief I had in mind.
            zh: 我想到一只累瘫在键盘上的猫，旁边就是刚写完的作业。我在 Create 里描述这个场景，再点开预览，看它有没有画出那种终于能松口气的感觉。
          gallery:
            - src: assets/projects/social-ai/create-prompt.webp
              thumbnail: assets/projects/social-ai/create-prompt-thumb.webp
              width: 1100
              height: 435
              thumbnailWidth: 640
              alt: {en: Scene description entered in the SocialAI Create form, zh: SocialAI 的 Create 表单中填入了想生成的画面}
              caption: {en: The prompt in the original Create form before generation., zh: 生成前，原版 Create 页面中的画面描述。}
            - src: assets/projects/social-ai/create-preview.webp
              thumbnail: assets/projects/social-ai/create-preview-thumb.webp
              width: 1100
              height: 900
              thumbnailWidth: 640
              alt: {en: Generated orange cat resting on a keyboard beside finished homework in warm light, zh: 暖光下，橘猫趴在键盘上，身旁放着写完的作业}
              caption: {en: The generated image opened for review before posting., zh: 点开本次实际生成的图，在发布前查看效果。}
        - id: keyword
          label: {en: Collection, zh: 图片集合}
          title: {en: Start with a word from the post, zh: 从正文中的一个词开始}
          body:
            en: Collection opens here with All selected. To narrow the gallery, switch to Keyword, enter “bridge” and choose Search.
            zh: 画面中选中的是 All，可以看到搜索前的全部图片。切换到 Keyword，输入 bridge，再点 Search 缩小范围。
          gallery:
            - src: assets/projects/social-ai/keyword.webp
              thumbnail: assets/projects/social-ai/keyword-thumb.webp
              width: 1102
              height: 720
              thumbnailWidth: 640
              alt:
                en: "Collection with All selected and three sample thumbnails showing a bridge, a sailboat and buildings"
                zh: "Collection 中选中了 All，可见桥梁、帆船和楼群三张示例图"
              caption:
                en: "Local frontend demo with sample data. Before the search, all three thumbnails are visible."
                zh: "本地前端演示，使用示例数据。搜索前，三张缩略图全部可见。"
        - id: result
          label: {en: Search result, zh: 搜索结果}
          title: {en: See which photo matches, zh: 看哪张图匹配}
          body:
            en: The Images tab now shows a single thumbnail. “Garden bridge” matches because its post contains the search word.
            zh: 搜索后，Images 页只剩一张缩略图。「Garden bridge」这条帖子的正文含有搜索词，因此它的配图被保留下来。
          gallery:
            - src: assets/projects/social-ai/result.webp
              thumbnail: assets/projects/social-ai/result-thumb.webp
              width: 1102
              height: 1464
              thumbnailWidth: 640
              alt:
                en: "Collection with Keyword selected and a single bridge thumbnail under Images"
                zh: "Collection 中选中了 Keyword，Images 下只有一张桥梁缩略图"
              caption:
                en: "Local frontend demo with sample data. The matching bridge post remains after searching."
                zh: "本地前端演示，使用示例数据。提交搜索后，画面只显示匹配的桥梁帖子。"
        - id: open
          label: {en: Image viewer, zh: 大图查看器}
          title: {en: Open the bridge photo, zh: 点开桥梁图片}
          body:
            en: Select the remaining thumbnail to inspect the bridge in the image viewer. The search has taken the reader from a remembered word to the image attached to that post.
            zh: 点击剩下的缩略图，大图查看器便会展开桥梁图片。从一个记得的词，读者找到了那条帖子的配图。
          gallery:
            - src: assets/projects/social-ai/open.webp
              thumbnail: assets/projects/social-ai/open-thumb.webp
              width: 1102
              height: 1114
              thumbnailWidth: 640
              alt:
                en: "Image viewer displaying the garden bridge illustration"
                zh: "大图查看器中展开的花园小桥示意图"
              caption:
                en: "Local frontend demo with sample data. The selected thumbnail opens in the image viewer."
                zh: "本地前端演示，使用示例数据。点开搜索结果后，桥梁图片在查看器里展开。"
        - id: architecture
          label: {en: System architecture, zh: 系统架构}
          title: {en: Where the words and the image go, zh: 正文和图片分别存在哪里}
          body:
            en: Create sends the author’s scene description to Go. The image-generation interface, which I designed and verified with coding-agent assistance during June 2026 maintenance, calls the configured provider and returns an image for preview. If the author publishes a post, Go stores its media in Google Cloud Storage and indexes its text, author and media URL in Elasticsearch. Collection can then search the index and load a matching image by URL. The bridge walkthrough starts with an existing sample post.
            zh: Create 将作者的画面描述提交给 Go。2026年6月维护时，我在编码助手协助下设计并验证了图像生成接口，由它调用配置的服务商，将图片返回给作者预览。作者决定发布后，Go 把媒体存入 Google Cloud Storage，并将正文、作者和媒体 URL 写入 Elasticsearch 索引。Collection 可以检索这个索引，再按 URL 加载匹配的图片。桥梁搜图演示从一条已有的示例帖子开始。
          gallery:
            - src: assets/projects/social-ai/architecture.webp
              thumbnail: assets/projects/social-ai/architecture-thumb.webp
              width: 1330
              height: 1030
              thumbnailWidth: 660
              englishImage:
                src: assets/projects/social-ai/architecture-en.webp
                thumbnail: assets/projects/social-ai/architecture-en-thumb.webp
                width: 1330
                height: 1072
                thumbnailWidth: 660
              alt:
                en: "Create previews a generated image before publication. Collection searches indexed posts and loads their media by URL."
                zh: "Create 在发布前预览生成的配图。Collection 从帖子索引中搜索，再按 URL 加载图片。"
              caption:
                en: "The search result carries the media URL. The browser makes a separate request for the image itself."
                zh: "搜索结果带回媒体 URL。图片文件由浏览器另行请求。"
        - id: sequence
          label: {en: Request sequence, zh: 请求时序}
          title: {en: Follow one search request, zh: 跟进一次搜索请求}
          body:
            en: React sends a GET request to /search?keywords=bridge with a bearer token. After JWT validation, the handler calls the post service in the same Go process. The service runs an Elasticsearch match query on the message field. Go returns JSON to React, which filters the posts by media type and displays the matching thumbnail.
            zh: React 向 /search?keywords=bridge 发出带 Bearer 令牌的 GET 请求。JWT 校验通过后，处理函数调用同一 Go 进程中的帖子服务，由它对 Elasticsearch 索引的 message 字段执行 match 查询。Go 把帖子列表以 JSON 返回，React 按媒体类型筛选，在图片页显示匹配的缩略图。
          gallery:
            - src: assets/projects/social-ai/sequence.webp
              thumbnail: assets/projects/social-ai/sequence-thumb.webp
              width: 1330
              height: 1212
              thumbnailWidth: 660
              englishImage:
                src: assets/projects/social-ai/sequence-en.webp
                thumbnail: assets/projects/social-ai/sequence-en-thumb.webp
                width: 1330
                height: 1156
                thumbnailWidth: 660
              alt:
                en: "Sequence of a keyword search, from the React request through JWT validation and an Elasticsearch match query to a bridge thumbnail and the open image viewer"
                zh: "关键词查询时序，从 React 请求、JWT 校验和 Elasticsearch 匹配，到桥梁缩略图和展开的大图查看器"
              caption:
                en: "The diagram follows the backend success path in code. The local walkthrough used a sample response to exercise the frontend."
                zh: "图中后端部分依据源码的成功路径绘制。本地演示使用示例响应来验证前端交互。"

  - id: online-ordering
    published: true
    name: {en: Online Food Ordering, zh: Online Food Ordering（在线订餐系统）}
    date: {en: Dec 2025 – Feb 2026, zh: 2025年12月 – 2026年2月}
    region: ny
    type: academic
    tech: Java, Spring Boot, Spring Security, Spring Data JDBC, PostgreSQL, Caffeine, React, Docker Compose
    keywords: [cart, transaction, backend, REST, SQL, 购物车, 事务, 订餐, 后端]
    summary:
      en: Add an item from a restaurant menu and open the cart to see what you ordered. Behind the plus button, a Spring service updates both the line item and the total.
      zh: 在餐厅菜单上选一道菜，点加号，再打开购物车就能看到刚点的菜和总价。点一次加号，背后的 Spring 服务要完成两处相关的写入。
    background:
      en: I built this ordering app during a full-stack development course. A React client handles menu browsing and the cart. The Java backend uses Spring Security sessions to identify each diner and Spring Data JDBC to store cart data in PostgreSQL.
      zh: 我在全栈开发课程中搭建了这款点餐应用。顾客通过 React 界面浏览菜单、查看购物车。Java 后端以 Spring Security 会话识别登录顾客，并通过 Spring Data JDBC 将购物车数据写入 PostgreSQL。
    workHeading: {en: My work on the cart, zh: 我的购物车实现}
    work:
      - en: I connected the React menu and cart to Spring Boot endpoints that resolve the customer from the signed-in session.
        zh: 我把 React 菜单和购物车接到 Spring Boot 接口上，后端根据登录会话确定这是谁的购物车。
      - en: I put the line-item update and the total-price update in one transaction. A successful write also evicts the customer’s cached cart so the next read returns the updated contents.
        zh: 我把菜品明细和总价的修改放进同一个事务。写入成功后，服务会使该顾客的购物车缓存失效，让下一次读取拿到更新后的内容。
    sectionOrder: [background, journey, contributions, process]
    journeyHeading: {en: Design decisions, zh: 设计取舍}
    journey:
      - title:
          en: "What happens when a diner taps +?"
          zh: "顾客点一下「＋」，这次请求走哪三层？"
        body:
          en: "React sends the menu item to a single Spring Boot backend. Spring Security identifies the diner from the session. CartController resolves the customer and passes the request to CartService, which decides whether to add a line or increase its quantity. The repository layer uses Spring Data JDBC to save the line and update the total in PostgreSQL. This division let me put the rule about what must change together in one service method."
          zh: "React 把选中的菜品发给一个 Spring Boot 后端。Spring Security 从会话识别顾客；控制器 CartController 找到对应的顾客，把请求交给服务层 CartService，由它决定新增一行还是给已有菜品加一份。最后是数据访问层 Repository，通过 Spring Data JDBC 把明细和总价写进 PostgreSQL。这样一来，哪些修改必须一起完成，就能在同一个服务方法里说清楚。"
      - title:
          en: "Why keep one database for the cart?"
          zh: "为什么购物车共用一个数据库？"
        body:
          en: "If I add the $4.89 Chicken Fries, the item and the extra $4.89 should appear together. I kept both records in one PostgreSQL database and updated them in one transaction. If either write fails, the transaction can roll back both. With separate writable databases per region, I would first need a rule for where a returning diner’s cart lives and how to reconcile changes. For this course app, one place to commit a cart update was a better fit."
          zh: "一份 Chicken Fries 是 4.89 美元。点完「＋」，明细多一份，总价也应同时多 4.89 美元。我把两项都放在同一个 PostgreSQL 数据库里，用一个事务更新；任何一步写入失败，都可以一起回滚。我们也讨论过按地区分库存储：顾客出差后再登录，该去哪里找原来的购物车？如果两地都允许修改，回来又以哪份为准？对这个课程项目，把一次加购集中在一处提交，更贴合当时的需要。"
      - title:
          en: "What if two diners want the last serving?"
          zh: "两位顾客同时点最后一份，会怎样？"
        body:
          en: "Limited stock was a design question we discussed. A shared database gives a restaurant one place to record how many servings remain. To accept an order for the last serving, a checkout would still have to check and reserve it atomically and handle a retried request. The implemented transaction covers cart items and totals. The course checkout clears the cart, so the demo demonstrates cart consistency and leaves stock reservation as a separate design problem."
          zh: "餐厅的菜会售罄，这是我们讨论过的设计问题。共用一个数据库，让餐厅有一处记录剩余份数。真要卖出最后一份，结账时仍得把「检查余量、扣减库存」作为一次不可分开的操作，还要处理顾客重复提交的请求。这个项目实际做的是购物车明细与总价的事务，课程版结账会清空购物车；最后一份菜归谁，是往真实订单系统再走一步时要解决的问题。"
    process:
      kicker: {en: Menu to cart, zh: 从菜单到购物车}
      heading: {en: Add one order of Chicken Fries, zh: 加购一份 Chicken Fries}
      intro:
        en: This walkthrough follows a signed-in diner in the local app. Chrome recorded the cart requests and responses. The two diagrams explain the server-side behavior from the source code.
        zh: 这次在本地应用中用已登录账号走了一遍加购流程。Chrome 记录了购物车的请求和响应，后面两张图依据源码说明服务端怎样处理它们。
      stages:
        - id: menu
          label: {en: Restaurant menu, zh: 餐厅菜单}
          title: {en: Pick Chicken Fries from the Burger King menu, zh: 在 Burger King 菜单里找到 Chicken Fries}
          body:
            en: Find Chicken Fries - 9 Pc, priced at $4.89. The plus button beside that item adds one serving to the signed-in diner’s cart.
            zh: 找到标价 $4.89 的 Chicken Fries - 9 Pc，点它右侧的「＋」，把一份菜品加入当前顾客的购物车。
          gallery:
            - src: assets/projects/online-ordering/menu.webp
              thumbnail: assets/projects/online-ordering/menu-thumb.webp
              width: 1100
              height: 760
              thumbnailWidth: 640
              alt:
                en: "Burger King menu listing Chicken Fries - 9 Pc at 4.89 beside an add button"
                zh: "Burger King 菜单列出标价 4.89 的 Chicken Fries - 9 Pc，右侧有加号按钮"
              caption:
                en: "The Chicken Fries row has its own plus button. The local menu shows text in place of the food photos."
                zh: "Chicken Fries 这一行右侧有加号。本地菜单的菜图位置显示替代文字。"
        - id: added
          label: {en: Add to cart, zh: 加购}
          title: {en: Get confirmation on the menu, zh: 在菜单上看到加购反馈}
          body:
            en: React sends POST /cart with the selected menu item’s ID. In the recorded run the server returned HTTP 200, and the menu displayed “Add to cart successfully.”
            zh: React 通过 POST /cart 提交所选菜品的 ID。本次操作中，服务端返回 HTTP 200，菜单上方随即出现加购成功提示。
          gallery:
            - src: assets/projects/online-ordering/added.webp
              thumbnail: assets/projects/online-ordering/added-thumb.webp
              width: 1100
              height: 760
              thumbnailWidth: 640
              alt:
                en: "Restaurant menu with an “Add to cart successfully” confirmation"
                zh: "餐厅菜单上方显示「Add to cart successfully」提示"
              caption:
                en: "The menu stays open after POST /cart succeeds."
                zh: "POST /cart 成功后，顾客仍停留在菜单上。"
        - id: cart
          label: {en: Cart drawer, zh: 购物车抽屉}
          title: {en: Open Cart and check the total, zh: 打开 Cart 核对总价}
          body:
            en: Opening Cart triggers a separate GET /cart request. The response returned HTTP 200 with one line item and a total of 4.89. The drawer shows the same item and $4.89 total.
            zh: 点击 Cart 会另外发出 GET /cart。此次响应状态为 HTTP 200，内容包含一条明细，总价为 4.89。购物车抽屉也显示了同一份菜品和 $4.89 的总价。
          gallery:
            - src: assets/projects/online-ordering/cart.webp
              thumbnail: assets/projects/online-ordering/cart-thumb.webp
              width: 1100
              height: 760
              thumbnailWidth: 640
              alt:
                en: "Open cart drawer showing Chicken Fries - 9 Pc and a total price of $4.89"
                zh: "购物车抽屉内有一份 Chicken Fries - 9 Pc，总价为 $4.89"
              caption:
                en: "One serving appears in the drawer. Its subtotal matches the $4.89 total."
                zh: "抽屉里有一份菜品，菜品小计与底部总价均为 $4.89。"
        - id: architecture
          label: {en: Local system architecture, zh: 本地系统架构}
          title: {en: From the browser to the customer’s cart, zh: 从浏览器找到顾客的购物车}
          body:
            en: In the local Docker Compose setup, Nginx serves the React app and proxies API calls to Spring Boot. Spring Security supplies the signed-in identity, and the controller resolves the customer through CustomerService. CartService uses Spring Data JDBC to reach PostgreSQL and keeps a Caffeine cart cache keyed by customer ID in the backend process.
            zh: 本地通过 Docker Compose 启动应用。Nginx 提供 React 静态资源，并把 API 请求转发到 Spring Boot。Spring Security 提供登录身份，控制器再通过 CustomerService 找到顾客。CartService 通过 Spring Data JDBC 读写 PostgreSQL，并在后端进程内使用 Caffeine 按顾客 ID 缓存购物车。
          gallery:
            - src: assets/projects/online-ordering/architecture.webp
              thumbnail: assets/projects/online-ordering/architecture-thumb.webp
              width: 1330
              height: 1665
              thumbnailWidth: 660
              englishImage:
                src: assets/projects/online-ordering/architecture-en.webp
                thumbnail: assets/projects/online-ordering/architecture-en-thumb.webp
                width: 1330
                height: 1666
                thumbnailWidth: 660
              alt:
                en: "React reaches Spring Boot through Nginx. The cart service uses PostgreSQL via Spring Data JDBC and a per-customer Caffeine cache."
                zh: "React 通过 Nginx 访问 Spring Boot。购物车服务经 Spring Data JDBC 读写 PostgreSQL，并在 Caffeine 中按顾客缓存购物车。"
              caption:
                en: "The diagram shows the local deployment used for the walkthrough. The course app was also deployed on AWS App Runner with managed PostgreSQL on AWS."
                zh: "图中是本次演示使用的本地部署。这款课程应用也曾部署到 AWS App Runner，并使用 AWS 托管的 PostgreSQL。"
        - id: sequence
          label: {en: Request sequence, zh: 请求时序}
          title: {en: Save an item, then read back the cart, zh: 写入菜品，再读回购物车}
          body:
            en: On a write, CartService reads the menu price and any matching cart line. It inserts the line or increments its quantity, then updates the total in the same transaction. After a successful write, the customer’s cache entry is evicted. On the next cache miss, the service reads the cart, its lines and menu details from PostgreSQL and caches the assembled result.
            zh: 加购时，CartService 读取菜品价格并查找对应明细。它新增一条明细或增加已有数量，接着在同一事务中更新总价。写入成功后，该顾客的缓存条目失效。下次读取未命中缓存时，服务从 PostgreSQL 取出购物车、明细和菜品资料，组装结果并重新缓存。
          gallery:
            - src: assets/projects/online-ordering/sequence.webp
              thumbnail: assets/projects/online-ordering/sequence-thumb.webp
              width: 1330
              height: 1382
              thumbnailWidth: 660
              englishImage:
                src: assets/projects/online-ordering/sequence-en.webp
                thumbnail: assets/projects/online-ordering/sequence-en-thumb.webp
                width: 1330
                height: 1424
                thumbnailWidth: 660
              alt:
                en: "A POST updates the cart and evicts its cache entry. A subsequent GET reads the cart and returns its single item and total."
                zh: "POST 更新购物车并使其缓存失效，随后的 GET 读取购物车并返回一条明细和总价。"
              caption:
                en: "Chrome recorded both HTTP responses. The database transaction and cache operations shown between them follow the service implementation."
                zh: "两次 HTTP 响应由 Chrome 实测记录，其间的数据库事务和缓存操作依据服务实现绘制。"

  - id: vitalguard
    published: true
    name: {en: VitalGuard AI, zh: VitalGuard AI（AIoT 可穿戴健康洞察原型）}
    date: {en: 'Sep 2025 – Dec 2025', zh: '2025年9月 – 2025年12月'}
    region: ny
    type: academic
    tech: ESP32, MicroPython, MAX30102, HDC1080, ADXL345, FSR402, Flask, OpenAI API
    keywords: [AIoT, IoT, wearable, ESP32, Flask, LLM, 物联网, 可穿戴]
    summary:
      en: A Columbia AIoT course prototype that connects an ESP32 wearable sensor assembly to a Flask service, a structured LLM-report path, and a mobile-friendly web dashboard.
      zh: 一个 Columbia AIoT 课程原型：将 ESP32 可穿戴传感器组件连接到 Flask 服务、结构化 LLM 报告链路与适配手机的 Web 仪表板。
    background:
      en: VitalGuard AI was developed for Columbia EECS E4764 Artificial Intelligence of Things in Fall 2025. The project moved from an early course proposal into a working sensor-to-dashboard prototype, with the embedded firmware, Flask service, and browser interface kept as separate parts of the system.
      zh: VitalGuard AI 是 Columbia EECS E4764 Artificial Intelligence of Things 2025 年秋季课程项目。团队从早期课程方案逐步完成传感器到仪表板的原型，并将嵌入式固件、Flask 服务与浏览器界面作为独立部分开发。
    team: {en: Group 19, zh: 第19组}
    members:
      - name: {en: Daolin Li, zh: Daolin Li}
        url: https://github.com/dl3832
      - name: {en: Hao Chen, zh: Hao Chen}
        url: https://github.com/JarrettChen217
      - name: {en: Sripad Karne, zh: Sripad Karne}
        url: https://github.com/Sripadkarne
      - name: {en: Yizheng Tang, zh: Yizheng Tang}
    workHeading: {en: Hao Chen’s contribution, zh: Hao Chen 的贡献}
    work:
      - en: Cloud backend, frontend, and data pipeline.
        zh: 云端后端、前端与数据管道。
      - en: Built the ESP32 sensor prototype with a hardware teammate and wrote the device-side MicroPython that reads the sensors and uploads batches over Wi-Fi HTTP.
        zh: 与硬件队友一起完成 ESP32 传感器原型，并编写设备端 MicroPython：读取传感器、通过 Wi-Fi HTTP 批量上传。
      - en: Worked on the ESP32-to-Flask path and the browser-facing service workflow.
        zh: 参与 ESP32 到 Flask 的数据链路与面向浏览器的服务流程。
    architecture:
      - title: {en: Wearable sensing, zh: 可穿戴传感}
        body:
          en: The final firmware reads a MAX30102 PPG module, HDC1080 temperature and humidity sensor, ADXL345 accelerometer, and FSR402 force sensor. These are prototype readings, not clinical measurements.
          zh: 最终固件读取 MAX30102 PPG 模块、HDC1080 温湿度传感器、ADXL345 加速度计与 FSR402 力传感器。所有读数均为原型读数，并非临床测量。
      - title: {en: ESP32 and I²C expansion, zh: ESP32 与 I²C 扩展}
        body:
          en: MicroPython firmware uses the ESP32 as the controller and a TCA9548A I²C multiplexer to connect sensor modules alongside the ADC-based force input.
          zh: MicroPython 固件以 ESP32 为控制核心，并通过 TCA9548A I²C 多路复用器连接传感器模块，同时读取基于 ADC 的压力输入。
      - title: {en: Wi-Fi upload, zh: Wi-Fi 上传}
        body:
          en: The device batches JSON sensor payloads and sends them through Wi-Fi HTTP requests to the Flask API. No Bluetooth transport is claimed for the final reviewed firmware.
          zh: 设备将传感器数据打包为 JSON，通过 Wi-Fi HTTP 请求发送至 Flask API。经核对的最终固件不主张使用蓝牙传输。
      - title: {en: Flask service and status labels, zh: Flask 服务与状态标签}
        body:
          en: The backend accepts recent data, provides browser endpoints, and derives heuristic status labels for a dashboard. No performance, accuracy, or latency metric is claimed.
          zh: 后端接收近期数据、提供浏览器接口，并生成用于仪表板的启发式状态标签。页面不主张性能、准确率或延迟指标。
      - title: {en: Structured report path, zh: 结构化报告链路}
        body:
          en: The reviewed code includes an OpenAI gpt-4o-mini integration that can send structured statuses and recent history for a conservative report. The source does not independently prove a live API response at a specific demo moment.
          zh: 经核对的代码包含 OpenAI gpt-4o-mini 集成，可将结构化状态与近期历史发送以生成谨慎的报告。现有资料未独立证明某个演示时刻的实时 API 返回。
    process:
      heading: {en: From course proposal to a working prototype, zh: 从课程方案到可运行原型}
      intro:
        en: The October proposal framed the use case and an ambitious system map. The implementation then narrowed that scope into a sensor-connected ESP32 prototype, an HTTP backend path, and a browser dashboard that the team could demonstrate.
        zh: 10 月的提案先界定使用场景并绘制了较完整的系统设想；之后团队将范围收敛为可连接传感器的 ESP32 原型、HTTP 后端链路与可演示的浏览器仪表板。
      stages:
        - id: proposal
          label: {en: Proposal, zh: 方案阶段}
          title: {en: Course framing and the first system map, zh: 课程定位与第一版系统图}
          body:
            en: The initial presentation from 20 October 2025 set out a wearable-to-cloud-to-user concept and a list of possible sensors and interfaces. It is shown here as design-stage context. Its AWS, socket, Bluetooth, OLED, native-app, and emergency-alert items were proposals, not final implementation claims.
            zh: 2025 年 10 月 20 日的初始展示提出了从可穿戴设备到云端再到用户端的构想，以及候选传感器与界面。这里将其作为设计阶段背景展示；其中 AWS、Socket、蓝牙、OLED、原生 App 与紧急通知均属方案内容，不作为最终实现主张。
          gallery:
            - src: assets/projects/vitalguard/vitalguard-proposal-flow-1024.webp
              thumbnail: assets/projects/vitalguard/vitalguard-proposal-flow-512.webp
              width: 1024
              height: 389
              thumbnailWidth: 512
              alt: {en: Early proposal graphic showing device, cloud, and phone, zh: 早期提案中展示设备、云端与手机的示意图}
              caption:
                en: "Original proposal graphic: an early device-to-cloud-to-user framing, not evidence of the final transport or app implementation."
                zh: 原始提案图：早期的设备到云端再到用户端构想，不代表最终传输方式或 App 实现。
            - src: assets/projects/vitalguard/vitalguard-proposal-map-1400.webp
              thumbnail: assets/projects/vitalguard/vitalguard-proposal-map-700.webp
              width: 1400
              height: 1096
              thumbnailWidth: 700
              alt: {en: Early VitalGuard proposal block diagram, zh: VitalGuard 早期提案框图}
              caption:
                en: The October proposal’s broad system map. The later prototype used the verified ESP32, Wi-Fi HTTP, Flask, and browser-dashboard path described on this page.
                zh: 10 月提案中的完整系统图。后续原型采用了本页所述、经核对的 ESP32、Wi-Fi HTTP、Flask 与浏览器仪表板链路。
        - id: hardware
          label: {en: Hardware build, zh: 硬件制作}
          title: {en: A glove-mounted sensor assembly, zh: 手套式传感器组件}
          body:
            en: The team assembled a glove-mounted prototype around an ESP32, battery, breakout boards, and wired sensors. The physical build made the sensor placement, power, and cabling constraints visible before the software path could be demonstrated.
            zh: 团队围绕 ESP32、电池、扩展板与有线传感器搭建了手套式原型。实体制作让传感器位置、供电与布线限制在软件链路演示之前就变得可见。
          gallery:
            - src: assets/projects/vitalguard/vitalguard-circuit-diagram-768.webp
              thumbnail: assets/projects/vitalguard/vitalguard-circuit-diagram-384.webp
              width: 768
              height: 1152
              thumbnailWidth: 384
              alt: {en: ESP32 circuit diagram with pressure, I²C multiplexer, and sensor connections, zh: 包含压力传感器、I²C 多路复用器和传感器连接的 ESP32 电路图}
              caption:
                en: "ESP32 wiring reference: the pressure divider feeds an ADC input, while the temperature/humidity, PPG, and accelerometer modules share a TCA9548A I²C multiplexer."
                zh: ESP32 接线参考：压力分压电路接入 ADC 输入；温湿度、PPG 与加速度计模块经 TCA9548A I²C 多路复用器连接。
            - src: assets/projects/vitalguard/vitalguard-prototype-tabletop-960.webp
              thumbnail: assets/projects/vitalguard/vitalguard-prototype-tabletop-480.webp
              width: 960
              height: 1280
              thumbnailWidth: 480
              alt: {en: Tabletop view of the glove-mounted VitalGuard prototype, zh: 桌面上的 VitalGuard 手套式原型}
              caption:
                en: The working assembly combines the glove, ESP32 board, battery, breakout modules, and wired sensors.
                zh: 可工作的组件结合了手套、ESP32 开发板、电池、扩展模块与有线传感器。
            - src: assets/projects/vitalguard/vitalguard-prototype-worn-960.webp
              thumbnail: assets/projects/vitalguard/vitalguard-prototype-worn-480.webp
              width: 960
              height: 1280
              thumbnailWidth: 480
              alt: {en: VitalGuard prototype worn on a hand, zh: 佩戴在手上的 VitalGuard 原型}
              caption:
                en: The worn prototype makes the placement and cabling of the hand-mounted assembly visible.
                zh: 佩戴状态展示了手部组件的放置方式与布线。
        - id: pipeline
          label: {en: Data path, zh: 数据链路}
          title: {en: Wiring the sensor path to the backend, zh: 将传感器链路接入后端}
          body:
            en: The final firmware maps the HDC1080, MAX30102, ADXL345, FSR402, and TCA9548A connections into one ESP32 program. It then packages readings for Wi-Fi HTTP upload to the Flask service.
            zh: 最终固件将 HDC1080、MAX30102、ADXL345、FSR402 与 TCA9548A 的连接整合至一个 ESP32 程序，并将读数打包后经 Wi-Fi HTTP 上传至 Flask 服务。
          gallery:
            - src: assets/projects/vitalguard/vitalguard-connection-map-1600.webp
              thumbnail: assets/projects/vitalguard/vitalguard-connection-map-800.webp
              width: 1600
              height: 251
              thumbnailWidth: 800
              alt: {en: Sensor connection map for the VitalGuard ESP32 prototype, zh: VitalGuard ESP32 原型的传感器连接图}
              caption:
                en: Connection notes for the temperature and humidity, PPG, force, accelerometer, and I²C multiplexer modules.
                zh: 温湿度、PPG、压力、加速度计与 I²C 多路复用器模块的连接说明。
        - id: interface
          label: {en: Interface and report, zh: 界面与报告}
          title: {en: Making the system legible on a phone-sized screen, zh: 在手机尺寸界面中呈现系统状态}
          body:
            en: The browser dashboard groups prototype readings and heuristic labels into a compact mobile-friendly interface. The code also defines a structured LLM-report path, while the page avoids presenting the UI as a medical diagnosis or a validated live clinical system.
            zh: 浏览器仪表板将原型读数与启发式标签组织成适配手机的紧凑界面。代码也定义了结构化 LLM 报告链路；本页不会将该界面描述为医疗诊断或经验证的临床实时系统。
          gallery:
            - src: assets/projects/vitalguard/vitalguard-dashboard-874.webp
              thumbnail: assets/projects/vitalguard/vitalguard-dashboard-437.webp
              width: 874
              height: 1068
              thumbnailWidth: 437
              alt: {en: VitalGuard mobile-friendly browser dashboard, zh: VitalGuard 适配手机的浏览器仪表板}
              caption:
                en: The dashboard layout exposes sensor visualisation, status labels, and the report entry point on a phone-sized browser.
                zh: 仪表板在手机尺寸浏览器中呈现传感器可视化、状态标签与报告入口。
    youtubeDemo:
      videoId: b8C_5I-G9is
      embedUrl: https://www.youtube.com/embed/b8C_5I-G9is
      url: https://youtu.be/b8C_5I-G9is
      title: {en: VitalGuard project demo, zh: VitalGuard 项目演示}
      linkLabel: {en: Watch on YouTube, zh: 在 YouTube 观看}
    links:
      - label: {en: Project source on GitHub, zh: GitHub 项目源码}
        url: https://github.com/JarrettChen217/EECS-E4764-2025-Fall-Final-Project-vitalguard-ai
    sectionOrder: [background, contributions, architecture, process, youtube, resources, scope]
    boundary:
      en: Columbia AIoT course prototype. The proposal graphics document the design process, while the page distinguishes them from the final reviewed firmware and service path. The prototype does not claim clinical validation, medical-device capability, diagnosis, emergency dispatch, or measured real-time performance.
      zh: Columbia AIoT 课程原型。提案图用于记录设计过程，本页将其与经核对的最终固件和服务链路区分开来。该原型不主张临床验证、医疗器械能力、诊断、紧急调度或可量化的实时性能。

  - id: spiresight
    published: true
    name: {en: SpireSight, zh: SpireSight（桌面截图助手）}
    date: {en: May 2026 – Jun 2026, zh: 2026年5月 – 2026年6月}
    region: ny
    type: personal
    tech: Python
    keywords: [vision LLM, OpenAI, Anthropic, Gemini, request logs, Claude Code, Cursor, 视觉模型, 截图, 请求日志]
    summary:
      en: SpireSight is a desktop assistant that sends screenshots to a vision model and displays the answer as it streams in. Claude Code and Cursor wrote nearly all the code.
      zh: SpireSight 是一款桌面助手，将截图发给视觉模型，并实时显示模型陆续返回的回答。代码几乎全部由 Claude Code 和 Cursor 编写。
    background:
      en: I specified a single interface for sending screenshots to models from OpenAI, Anthropic and Gemini. I ran the app to check its streamed answers against the specification and used the CI results when deciding whether to accept a release.
      zh: 我在规格中要求通过同一个接口把截图发给 OpenAI、Anthropic 和 Gemini 的模型。我运行应用，对照规格验收流式回答，再结合 CI 结果决定是否接受发布。
    work: []
    sectionOrder: [process, architecture, sequence, prompts, background, journey, resources]
    process:
      kicker: {en: Gameplay walkthrough, zh: 实机演示}
      heading: {en: Why Sword Boomerang fits this deck, zh: 这副牌为什么选飞剑回旋镖？}
      intro:
        en: In this Slay the Spire run, I used Inspect to capture my deck before asking for help at a card reward. SpireSight carried the deck summary into the next prompt, so the answer could refer to cards I already held.
        zh: 这局《杀戮尖塔》里，我先用 Inspect 记录牌库，再问三张奖励牌该选哪一张。SpireSight 会把牌库摘要放进后续提示词，回答时就能结合我手里已经有的牌。
      stages:
        - id: inspect-deck
          label: {en: Inspect, zh: 记录牌库}
          title: {en: From the deck screen to Run State, zh: 从牌库画面到本局摘要}
          body:
            en: With the deck open, I used the Inspect controls in the lower left of SpireSight. In Run State I could check what it had picked up. It listed five Strikes and four Defends and identified Bash as my only source of Vulnerable.
            zh: 我打开游戏里的牌库，用 SpireSight 左下角的 Inspect 控件捕获画面，再到 Run State 核对识别结果。摘要里有五张打击、四张防御，还指出 Bash（痛击）是这副牌里唯一能施加易伤的牌。
          gallery:
            - src: assets/projects/spiresight/deck.webp
              thumbnail: assets/projects/spiresight/deck-thumb.webp
              width: 1440
              height: 588
              thumbnailWidth: 680
              alt: {en: Ironclad deck open in the game with rows of attack and skill cards, zh: 游戏中展开的铁甲战士牌库，攻击牌和技能牌分行排列}
              caption: {en: The deck I captured during the run., zh: 我在这一局里捕获的牌库画面。}
            - src: assets/projects/spiresight/run-state.webp
              thumbnail: assets/projects/spiresight/run-state-thumb.webp
              width: 870
              height: 570
              thumbnailWidth: 680
              alt: {en: SpireSight Run State showing Bash above the Strike and Defend counts, zh: SpireSight 的 Run State 在打击和防御的数量上方单独列出了 Bash}
              caption: {en: Run State highlights Bash and explains what it contributes to the deck., zh: Run State 把 Bash 单独列出，并说明它在这副牌里的作用。}
        - id: card-reward
          label: {en: Card selection, zh: 选牌建议}
          title: {en: A recommendation that refers back to Bash, zh: 把新牌和已有的痛击连起来}
          body:
            en: At the reward screen, the assistant recommended the middle card, Sword Boomerang. Its reasoning referred back to Bash. With three energy I could play Bash first to apply Vulnerable, then spend the last energy on Sword Boomerang. It also pointed out the drawback of random targeting against several enemies.
            zh: 三选一时，助手推荐了中间的飞剑回旋镖。理由接上了刚才的牌库：有三点能量时，可以先用痛击施加易伤，再花最后一点打出飞剑回旋镖。回答也提醒我，面对多个敌人时，随机攻击很难集中在想击倒的目标上。
          gallery:
            - src: assets/projects/spiresight/rewards.webp
              thumbnail: assets/projects/spiresight/rewards-thumb.webp
              width: 1008
              height: 608
              thumbnailWidth: 680
              alt: {en: Three reward cards with Sword Boomerang in the middle, zh: 三张奖励牌，中间是飞剑回旋镖}
              caption: {en: The three choices on screen when I asked for a recommendation., zh: 我询问选牌建议时，游戏给出的三个选项。}
          demo:
            src: assets/projects/spiresight/shop-advice.mp4
            poster: assets/projects/spiresight/shop-poster.webp
            width: 876
            height: 568
            caption:
              en: The clip opens on the Sword Boomerang answer. At the next shop request, watch the new answer appear line by line in the same chat.
              zh: 录屏开头保留了飞剑回旋镖的推荐理由。接着我在商店再次提问，可以看到同一聊天窗口里逐步出现新的建议。
        - id: settings
          label: {en: Settings, zh: 设置}
          title: {en: What goes into the next request?, zh: 下一次追问会带上什么？}
          body:
            en: In Providers, I can configure a service and refresh its list of models. In General, I can choose which screenshots accompany a follow-up. With “Latest only”, earlier chat messages keep their text and only the current message can include an image. The deck summary from Inspect still goes into the prompt as text. That lets me ask about a new reward screen while keeping the same deck in context.
            zh: 我可以在 Providers 里配置服务、刷新可选模型，再到 General 里决定追问时带哪些截图。选「Latest only」时，之前的聊天保留文字，只有本次消息可以附图。Inspect 整理出的牌库摘要仍然以文字放进提示词。这样换到新的奖励画面时，模型既能看眼前的选项，也能参考刚才那副牌。
          gallery:
            - src: assets/projects/spiresight/settings-providers.webp
              thumbnail: assets/projects/spiresight/settings-providers.webp
              width: 597
              height: 397
              thumbnailWidth: 597
              alt: {en: Providers tab with the OpenAI service selected and a Refresh models button, zh: Providers 页选中了 OpenAI 服务，下方有刷新模型列表的按钮}
              caption: {en: Each provider has its own settings tab. Refresh models updates the list for the selected service., zh: 每个模型服务都有独立的设置页。「Refresh models」刷新当前服务的模型列表。}
            - src: assets/projects/spiresight/settings-general.webp
              thumbnail: assets/projects/spiresight/settings-general.webp
              width: 597
              height: 397
              thumbnailWidth: 597
              alt: {en: General tab showing the screenshot hotkey and Latest only follow-up policy, zh: General 页显示截图快捷键和追问时的 Latest only 选项}
              caption: {en: The capture shortcut here is Ctrl + Shift + S. The follow-up screenshot policy is the last control in the same window., zh: 图中设置的截图快捷键是 Ctrl + Shift + S。同一窗口最下面一项控制追问时携带的截图。}
    sequence:
      actors: [{"en": "Player", "zh": "玩家"}, {"en": "SpireSight", "zh": "桌面助手"}, {"en": "Run State", "zh": "牌库摘要"}, {"en": "Card index", "zh": "卡牌索引"}, {"en": "Vision model", "zh": "视觉模型"}]
      phases:
        - title: {"en": "Before the question · Inspect the deck", "zh": "提问之前 · 用 Inspect 记录牌库"}
          messages:
            - {"from": 0, "to": 1, "label": {"en": "Capture the deck screen and finish Inspect.", "zh": "捕获牌库画面，完成 Inspect。"}}
            - {"from": 1, "to": 4, "label": {"en": "Send the captured frames and the JSON extraction instructions.", "zh": "发送牌库截图和 JSON 提取指令。"}}
            - {"from": 4, "to": 1, "label": {"en": "Return card names, counts, relics and an assessment of the deck.", "zh": "返回牌名、数量、遗物和牌库评估。"}}
            - {"from": 1, "to": 2, "label": {"en": "Validate the JSON and save the current run. Bash is among the key cards.", "zh": "校验 JSON，保存本局状态。这副牌的关键牌里有痛击。"}}
        - title: {"en": "At the reward screen · Ask for a recommendation", "zh": "来到奖励界面 · 询问三张牌怎么选"}
          messages:
            - {"from": 0, "to": 1, "label": {"en": "Click Card Selection Guide with the reward screen open.", "zh": "打开奖励界面，点击「选牌建议」。"}}
            - {"from": 1, "to": 2, "label": {"en": "Read the most recent Inspect summary, if available.", "zh": "读取最近一次 Inspect 保存的本局摘要（如有）。"}}
            - {"from": 2, "to": 1, "label": {"en": "Supply the known deck as text alongside the strategy instructions.", "zh": "把已知牌库作为文字上下文附在策略指令后。"}}
            - {"from": 1, "to": 3, "label": {"en": "Optional lookup: match the question text against local card data.", "zh": "可选检索：用本轮问题的文字匹配本地卡牌资料。"}}
            - {"from": 3, "to": 1, "label": {"en": "On a match, add card facts and their source. Otherwise continue without them.", "zh": "命中时附上卡牌资料和出处；未命中则继续请求。"}}
            - {"from": 1, "to": 4, "label": {"en": "The provider adapter sends the instructions, available context, question and reward screenshot.", "zh": "服务适配器发送策略指令、已有上下文、本轮问题和奖励截图。"}}
            - {"from": 4, "to": 1, "label": {"en": "Stream the recommendation and its reasons in text fragments.", "zh": "逐段返回推荐和理由。"}}
            - {"from": 1, "to": 0, "label": {"en": "Display each fragment. In this run: play Bash, then Sword Boomerang; its random targeting matters against groups.", "zh": "收到一段就显示一段。这局的建议是先打痛击，再用飞剑回旋镖；遇到多个敌人时要考虑随机目标。"}}
    architecture:
      - title:
          en: One request interface
          zh: 一次请求怎样抵达模型
        body:
          en: A Python runner assembles the instructions, messages and optional screenshots. The selected provider adapter translates them into the OpenAI, Anthropic or Gemini API format. Each returns text increments through the same stream interface, so the chat window can display them as they arrive.
          zh: Python 调用层组装指令、消息和可选截图，再由所选服务的适配器转换为 OpenAI、Anthropic 或 Gemini 的 API 格式。各家返回的文字片段通过同一个流式接口交给聊天窗口，收到一段就显示一段。
      - title:
          en: Typing a follow-up
          zh: 在聊天框里追问
        body:
          en: 'The app keeps an ordered list of user and assistant messages in memory. A typed follow-up sends all the text in the current conversation plus the new question. Clearing the conversation starts a fresh list. Image retention has its own setting: Latest only strips images from earlier turns; the current turn can carry a fresh capture or reuse the last screenshot.'
          zh: 应用在内存里按顺序保存用户消息和助手回答。手动追问时，会把当前会话的全部文字连同新问题一起发送；清空对话后重新记录。图片单独处理：在 Latest only 下，历史消息只留文字，本轮可以附上新截图，也可以复用上一张。
      - title:
          en: Pressing a quick action
          zh: 点击快捷操作
        body:
          en: A quick action sends the shared strategy instructions, the action’s question, any extra text and the optional screenshot. An available Inspect summary is appended to the system instructions. The request log snapshot can include earlier chat turns; the provider call for the button sends only the current user message.
          zh: 快捷按钮使用共用的策略指令，配上该按钮的问题、用户补充的文字和可选截图。已有的 Inspect 牌库摘要会追加到系统指令。请求日志的快照可以包含旧对话；按钮实际发给服务商的用户消息只有本轮这一条。
      - title:
          en: Where card facts come from
          zh: 选牌时去哪里查卡牌资料
        body:
          en: Card Selection can search a local index of Slay the Spire 2 card facts cached from wiki.gg. It searches the request text by name, alias, fuzzy match and keyword, returning up to five hits within a 1,800-character context budget. A hit supplies facts such as cost, effect, upgrade and source. Without a hit the request proceeds. The run footage alone cannot tell us whether a lookup matched.
          zh: 选牌按钮可以查询本地卡牌索引，资料来自 wiki.gg 的《杀戮尖塔 2》卡牌页面。它用请求文字匹配卡名、别名、近似名称和关键词，最多取五条，附加文本上限为 1,800 个字符。命中后可补充费用、效果、升级说明和出处；没有命中也会继续请求。仅凭这段实机画面无法判断当时是否命中了索引。
    prompts:
      - title:
          en: Inspect · read the deck
          zh: Inspect · 读牌库
        why:
          en: Overlapping screenshots can show the same card twice. The extraction rules explicitly address duplicates and require JSON that the app can validate before saving the run state.
          zh: 滚动截图可能两次拍到同一张牌。提取指令要求处理重叠，按固定 JSON 格式输出，让应用在保存本局状态前先校验。
        original: |-
          You are a Slay the Spire II run-state extractor. Look at the
          screenshot and output a single JSON object matching this schema:

          {
            "cards":  [{"name": str, "count": int, "rarity": str,
                        "usefulness": str, "note": str}],
            "relics": [{"name": str, "synergy_tags": [str]}],
            "potions": [str],
            "archetype_candidates":
                      [{"name": str, "confidence": str, "rationale": str}],
            "overall_eval": str,
            "inspected_at": "ISO-8601 timestamp"
          }

          You will receive one or more screenshots of the deck view, possibly
          with overlap from the player scrolling. Treat them as views of the
          same deck — a card visible in multiple frames is the same card and
          must be counted exactly once. Aggregate the full deck from all
          frames before emitting the JSON.

          Rules:
          - rarity in {"starter", "common", "uncommon", "rare"}.
          - usefulness in {"skip", "situational", "good", "key"}. Judge each
            card in the context of the candidate archetypes, not in absolute
            terms.
          - confidence in {"low", "medium", "high"}.
          - archetype_candidates: 1-3 entries, highest confidence first.
          - overall_eval: 2-3 sentences. Diagnosis only - no advice.
          - "note" is one short sentence or "".
          - Output JSON only, no prose, no markdown fence.
      - title:
          en: Strategy · give a recommendation
          zh: 策略 · 给建议
        why:
          en: All four buttons use this system prompt. It asks for a recommendation first, up to three supporting points, and risks or uncertainty. Those are reasons the player can check; the template does not ask for a private step-by-step reasoning trace.
          zh: 四个快捷按钮共用这段系统指令。先给一句建议，再给最多三条理由，并指出风险和不确定之处。玩家可以拿这些理由对照牌面；模板没有要求模型输出逐步的内部思维链。
        original: |-
          You are an expert Slay the Spire II strategist. You analyze game
          screenshots and provide concise, actionable advice.

          Conventions:
          - Lead with the recommendation in one sentence.
          - Justify in <= 3 bullet points.
          - Call out risks explicitly.
          - When uncertain, say so.

          Priorities, in order: immediate threats, long-run deck health,
          energy/economy curves.

          If a "## Current Run Context" section is appended below, use it to
          bias your advice toward the player's existing archetype direction
          and known deck contents. Do not contradict it unless the
          screenshot proves the context stale.
      - title:
          en: Card Selection Guide
          zh: 选牌建议
        why:
          en: The reward screenshot supplies the choices. Extra text can name a card for the local lookup.
          zh: 奖励截图给出候选项，补充文字里写出的卡名还可用于本地检索。
        original: |-
          Help me choose between the offered cards. {custom_text}
          请帮我选择卡牌。{custom_text}
      - title:
          en: Combat Strategy
          zh: 战斗策略
        why:
          en: The question limits the recommendation to the current turn.
          zh: 把决策范围限定在眼前这个回合。
        original: |-
          What's the best play this turn? {custom_text}
          本回合最佳出牌是什么?{custom_text}
      - title:
          en: Pathfinding
          zh: 地图选路
        why:
          en: The question asks for a route and the reason for taking it.
          zh: 同时索要路线和选择理由，方便对照地图。
        original: |-
          Which path should I take and why? {custom_text}
          应该选哪条路线?为什么?{custom_text}
      - title:
          en: Relic Analysis
          zh: 遗物评估
        why:
          en: This directs the shared strategy prompt toward the relic on offer.
          zh: 让共用的策略指令聚焦当前可选的遗物。
        original: |-
          Evaluate this relic offering. {custom_text}
          评估这个遗物。{custom_text}
      - title:
          en: Freeform · first message
          zh: 自由提问 · 第一条消息
        why:
          en: For an empty conversation, the instructions ground the answer in the question and attached image and ask the model to flag missing information.
          zh: 会话为空时，用问题和所附截图确定回答范围，信息不足时明确指出。
        original: You are a Slay the Spire 2 strategy assistant. Answer the user's question using their message and any screenshot they provide. Do not refer to prior conversation unless messages are included in the request. If you lack information needed to answer well, say so explicitly rather than guessing.
      - title:
          en: Follow-up · existing conversation
          zh: 追问 · 已有对话
        why:
          en: This is the base instruction for a typed follow-up. The runner also appends the current run summary when one is available.
          zh: 这是手动追问的基础指令。如果已经做过 Inspect 且摘要仍在，调用层还会把当前牌库摘要追加在它后面。
        original: You are continuing a previous conversation. The user is asking a follow-up question without re-attaching the structured run state (cards, relics, potions). Rely on prior assistant messages for game-state context. If the user asks something that requires information you cannot infer from the conversation history, say so explicitly rather than guessing.
    journey:
      - title: {en: How I specified request logging, zh: 我如何定义请求日志的规格}
        body:
          en: To investigate unexpected answers, I specified one log entry per request. The entry records the prompt, request settings and image metadata when the call starts. When it ends, the same entry records the answer or error.
          zh: 为了排查不符合预期的回答，我要求每次请求对应一条日志。调用开始时，日志记录提示词、请求设置和图像元数据。调用结束后，再在同一条日志中补上回答或错误信息。
      - title: {en: How I checked the streamed response, zh: 我如何验收流式回答}
        body:
          en: I ran the desktop app and checked its streamed answers against the specification, including whether the response appeared on screen as the model returned it.
          zh: 我亲自运行桌面应用，把流式回答与规格逐项对照，检查模型返回的内容是否随生成过程逐步显示在屏幕上。
      - title: {en: How I accepted a release, zh: 我如何决定是否接受发布}
        body:
          en: Before accepting a tagged release, I checked the GitHub Actions results for Ruff linting, mypy type checking and pytest.
          zh: 接受带版本标签的发布前，我在 GitHub Actions 中查看 Ruff 代码检查、mypy 类型检查和 pytest 测试的结果。
    links:
      - label: {en: SpireSight source on GitHub, zh: 在 GitHub 查看 SpireSight 源码}
        url: https://github.com/JarrettChen217/SpireSight
      - label: {en: Original system prompts, zh: 系统提示词原文}
        url: https://github.com/JarrettChen217/SpireSight/blob/ac364e3ae565d2b61663ecc6eb6e192d5b24b08c/prompts/system_prompts.yaml
      - label: {en: Request assembly, zh: 请求组装源码}
        url: https://github.com/JarrettChen217/SpireSight/blob/ac364e3ae565d2b61663ecc6eb6e192d5b24b08c/src/spiresight/core/runner.py
      - label: {en: Local card index and sources, zh: 本地卡牌索引与资料来源}
        url: https://github.com/JarrettChen217/SpireSight/blob/ac364e3ae565d2b61663ecc6eb6e192d5b24b08c/data/sts2_cards/metadata.json

  - id: berry-street
    published: true
    name: {en: Berry Street Teachers App, zh: Berry Street Teachers App（教师应用设计）}
    logo:
      src: assets/projects/berry-street/wombat-mark.webp
      width: 380
      height: 236
      alt: {en: Wombat team mark, zh: Wombat 团队标识}
    date: {en: 'Feb 2025 – Aug 2025', zh: '2025年2月 – 2025年8月'}
    region: au
    type: team
    team: {en: Team025 Wombat, zh: Team025 Wombat}
    tech: Requirements engineering, Agile/Scrum, Figma
    keywords: [leadership, design, UX, 需求, 团队协作]
    summary:
      en: Requirements and interaction design for an iPad-oriented education application.
      zh: 面向 iPad 教育应用的需求分析与交互设计。
    background:
      en: This university–client collaboration was grounded in Trauma-Informed Positive Education (TIPE), a strengths-based approach that supports students’ regulation, relationships, wellbeing and engagement with learning. Students affected by stress or adversity may find it difficult to identify or communicate how they feel and whether they are ready to learn. Our project therefore explored a simple, non-judgemental digital check-in through which students could express their current readiness, while giving teachers a clearer view of the support their class might need.
      zh: 这是一个以 Trauma-Informed Positive Education（TIPE，创伤知情积极教育）为背景的大学客户合作项目。TIPE 是一种以优势为基础的教育方法，关注学生的情绪调节、人际关系、身心健康与学习参与。受到压力或不利经历影响的学生，有时难以及时识别和表达自己的感受，以及自己是否已经准备好进入学习状态。因此，本项目探索了一种简单且非评判性的数字签到方式，让学生表达当下的学习准备度，同时帮助教师更清楚地了解班级可能需要的支持。
    backgroundLink:
      label: {en: Learn about the TIPE approach, zh: 了解 TIPE 教育方法}
      url: https://pursuit.unimelb.edu.au/articles/Trauma-follows-children-into-the-classroom.-A-new-teaching-model-is-changing-that
    members:
      - name: {en: Ziyu Wang, zh: Ziyu Wang}
        url: https://github.com/Lafinoon
      - name: {en: Hao Chen, zh: Hao Chen}
        url: https://github.com/JarrettChen217
      - name: {en: Zikun Qiu, zh: Zikun Qiu}
        url: https://github.com/MLTqy1234
      - name: {en: Gaoyongle Zhang, zh: Gaoyongle Zhang}
        url: https://github.com/XinMoZ
      - name: {en: Junhao Zhu, zh: Junhao Zhu}
        url: https://github.com/junhaozhu1
    work: []
    process:
      heading: {en: From discovery to validation, zh: 从需求发现到方案验证}
      intro:
        en: The project moved through five connected stages. Each stage turned client context and user feedback into a more focused, testable design decision.
        zh: 项目沿着五个彼此衔接的阶段推进；每一阶段都把客户背景与用户反馈进一步转化为更聚焦、可验证的设计决策。
      stages:
        - id: discover
          label: {en: Discover, zh: 探索}
          title: {en: Start with the classroom need, zh: 从真实课堂需求出发}
          body:
            en: >-
              Early client conversations established the central need: a private, low-pressure way for students to communicate readiness to learn, paired with a teacher view that reveals class-level patterns without making the interaction difficult to use.
            zh: 前期客户交流明确了核心需求：学生需要一种私密、低压力的方式表达自己的学习准备度；教师则需要看到班级层面的趋势，同时整个交互必须保持简单易用。
          contribution:
            en: As Scrum Master, I coordinated discussions and sprint activities and helped turn client priorities into requirements the team could track.
            zh: 作为 Scrum Master，我协调讨论与冲刺活动，并协助把客户重点转化为团队可持续跟踪的需求。
          findings:
            - {en: Student check-ins should feel private and non-judgemental., zh: 学生签到应当保持私密且不带评判。}
            - {en: The interface needed to work for teachers with different levels of technical confidence., zh: 界面需要适应不同技术熟练度的教师。}
            - {en: Teachers needed both individual signals and class-level trends., zh: 教师既需要个体提示，也需要班级整体趋势。}
          gallery:
            - src: assets/projects/berry-street/goal-model-1600.webp
              thumbnail: assets/projects/berry-street/goal-model-800.webp
              width: 1600
              height: 368
              thumbnailWidth: 800
              alt: {en: Goal model connecting stakeholder roles with functional and emotional goals, zh: 关联利益相关方角色、功能目标与情感目标的目标模型}
              caption:
                en: The goal model connects students, teachers, school administrators and support teams with the functions and experiences the product should support.
                zh: 目标模型将学生、教师、学校管理者与支持团队关联到产品应支持的功能与体验目标。

        - id: define
          label: {en: Define, zh: 定义}
          title: {en: Translate needs into roles and stories, zh: 将需求整理为角色与用户故事}
          body:
            en: The team organised the problem around student, teacher and administrator roles, then connected their desired actions and feelings to epics, user stories and sprint tasks. This kept the design grounded in what each person needed to do and experience.
            zh: 团队围绕学生、教师与管理者三类角色梳理问题，再把他们期望完成的行为与获得的感受对应到 Epic、用户故事和冲刺任务，使设计始终围绕各角色真实的使用目标展开。
          contribution:
            en: I helped organise user stories, acceptance criteria, personas and journey materials so requirements could guide prototype and testing work.
            zh: 我参与整理用户故事、验收标准、用户画像与旅程材料，使需求能够持续指导原型和测试工作。
          gallery:
            - src: assets/projects/berry-street/role-do-be-feel-1600.webp
              thumbnail: assets/projects/berry-street/role-do-be-feel-800.webp
              width: 1530
              height: 1980
              thumbnailWidth: 765
              alt: {en: Role–Do–Be–Feel model for the student, teacher and administrator experience, zh: 面向学生、教师与管理者体验的 Role–Do–Be–Feel 模型}
              caption:
                en: Role–Do–Be–Feel connected stakeholder actions with the qualities and feelings the interface should support.
                zh: Role–Do–Be–Feel 模型将不同角色的行为，与界面应传达的特质和感受联系起来。
            - src: assets/projects/berry-street/user-story-map-1600.webp
              thumbnail: assets/projects/berry-street/user-story-map-800.webp
              width: 1600
              height: 1132
              thumbnailWidth: 800
              alt: {en: User story map arranging epics, stories and sprint tasks, zh: 按 Epic、用户故事与冲刺任务组织的用户故事地图}
              caption:
                en: The story map traces broad activities into prioritised work across three sprints.
                zh: 用户故事地图把整体活动拆解为跨三个冲刺逐步推进的优先任务。

        - id: prototype
          label: {en: Prototype, zh: 原型}
          title: {en: Make the core flows tangible, zh: 把核心流程变成可讨论的原型}
          body:
            en: Low-fidelity screens made the student check-in and teacher dashboard concrete enough to review. The deliberately rough presentation kept attention on navigation, wording and information hierarchy before visual polish.
            zh: 低保真页面把学生签到与教师仪表盘转化为可直接评审的流程。刻意保留的粗略视觉，让讨论先集中在导航、文案与信息层级，而不是过早进入视觉润色。
          contribution:
            en: I contributed to prototype direction and privacy-related design discussions, helping prepare the student and teacher flows for usability testing.
            zh: 我参与原型方向与隐私相关的设计讨论，并协助准备学生端和教师端流程进入可用性测试。
          gallery:
            - src: assets/projects/berry-street/lofi-check-in-1600.webp
              thumbnail: assets/projects/berry-street/lofi-check-in-800.webp
              width: 1600
              height: 1104
              thumbnailWidth: 800
              alt: {en: Low-fidelity student readiness check-in screen, zh: 学生学习准备度签到的低保真页面}
              caption:
                en: An early check-in explored how a primary-school student could report readiness with a single selection.
                zh: 早期签到页面探索了小学生通过一次选择表达学习准备度的方式。
            - src: assets/projects/berry-street/lofi-dashboard-1600.webp
              thumbnail: assets/projects/berry-street/lofi-dashboard-800.webp
              width: 1600
              height: 1104
              thumbnailWidth: 800
              alt: {en: Low-fidelity teacher classroom readiness dashboard, zh: 教师班级学习准备度仪表盘的低保真页面}
              caption:
                en: The initial dashboard brought response counts, a chart, trend history and a notice area into one teacher view.
                zh: 初版仪表盘将回答数量、图表、历史趋势与提示区域整合到同一个教师视图中。

        - id: test-and-learn
          label: {en: Test & learn, zh: 测试与学习}
          title: {en: Observe where the design caused hesitation, zh: 观察设计中引发犹豫的地方}
          body:
            en: During the 7 May usability session, the client worked through student and teacher tasks while the team recorded points of confidence and confusion. The session exposed which parts of the dashboard needed clearer visual and verbal cues.
            zh: 在 5 月 7 日的可用性测试中，客户依次完成学生端与教师端任务，团队记录顺畅之处及产生困惑的环节。这次测试明确指出了仪表盘在视觉和文字提示上需要改进的部分。
          contribution:
            en: I facilitated the low-fidelity usability session and helped connect the observations to the next iteration.
            zh: 我主持了这次低保真可用性测试，并协助把观察结果衔接到下一轮迭代。
          findings:
            - {en: The dashboard contained too much competing information at once., zh: 仪表盘同时呈现的信息过多，视觉焦点不够清晰。}
            - {en: Readiness scales and response counts were easy to confuse., zh: 学习准备度等级与回答数量容易产生混淆。}
            - {en: Trend labels needed clearer wording and context., zh: 趋势图标签需要更明确的文案和语境。}
          gallery:
            - src: assets/projects/berry-street/usability-dashboard-test-1600.webp
              thumbnail: assets/projects/berry-street/usability-dashboard-test-800.webp
              width: 1600
              height: 1280
              thumbnailWidth: 800
              alt: {en: Privacy-cropped frame from the teacher dashboard usability task, zh: 隐私裁切后的教师仪表盘可用性测试画面}
              caption:
                en: A privacy-cropped session frame retains the tested dashboard and task context while excluding participant video feeds.
                zh: 经过隐私裁切的测试画面保留了被测试的仪表盘与任务场景，并移除了参与者的视频画面。
            - src: assets/projects/berry-street/usability-planning-1600.webp
              thumbnail: assets/projects/berry-street/usability-planning-800.webp
              width: 1600
              height: 1200
              thumbnailWidth: 800
              alt: {en: Whiteboard mapping student and teacher usability tasks to prototype refinements, zh: 梳理学生及教师可用性任务与原型改进的白板}
              caption:
                en: The team linked student and teacher usability tasks to action items for the next prototype iteration.
                zh: 团队把学生端与教师端的测试任务衔接到下一轮原型的行动项。

        - id: refine-and-validate
          label: {en: Refine & validate, zh: 改进与验证}
          title: {en: Turn feedback into a clearer handover, zh: 将反馈转化为更清晰的交付方案}
          body:
            en: The revised dashboard removed the wellbeing score, clarified labels and added a bar-chart option alongside the doughnut view. In the final client walkthrough, the histogram was considered easier to read, the three-option student scale suited primary users, and the central workflow was accepted for handover.
            zh: 改进后的仪表盘移除了 wellbeing score，明确了标签，并在环形图之外增加柱状图选项。最终客户演示中，柱状图被认为更易阅读，三个选项的学生签到方式也更适合小学生，核心流程获得认可并进入交接。
          contribution:
            en: I helped carry usability findings into the refinement work and, as Scrum Master, coordinated requirements, testing and handover activities across the sprint.
            zh: 我协助把可用性测试结论落实到改进工作中，并以 Scrum Master 身份协调冲刺中的需求、测试与交接活动。
          findings:
            - {en: A simpler three-option check-in better matched primary-school use., zh: 更简洁的三个选项更符合小学阶段的使用场景。}
            - {en: The bar chart made the response distribution easier to compare., zh: 柱状图让回答分布更容易比较。}
            - {en: Further reduction of visual clutter remained an accessibility opportunity., zh: 继续减少视觉干扰仍是后续无障碍优化方向。}
          gallery:
            - src: assets/projects/berry-street/hifi-dashboard-1600.webp
              thumbnail: assets/projects/berry-street/hifi-dashboard-800.webp
              width: 1600
              height: 1104
              thumbnailWidth: 800
              alt: {en: Refined high-fidelity classroom readiness dashboard, zh: 改进后的高保真班级学习准备度仪表盘}
              caption:
                en: The high-fidelity dashboard uses clearer labels, a reduced readiness scale and a more approachable visual system.
                zh: 高保真仪表盘采用更明确的标签、更精简的准备度等级与更亲和的视觉系统。
            - src: assets/projects/berry-street/team-with-max-1600.webp
              thumbnail: assets/projects/berry-street/team-with-max-800.webp
              width: 1600
              height: 1067
              thumbnailWidth: 800
              alt: {en: Berry Street project team with supervisor Max, zh: Berry Street 项目团队与导师 Max 的合照}
              caption: {en: The Wombat team with our supervisor Max., zh: Wombat 团队与导师 Max 合影。}
          demo:
            src: assets/projects/berry-street/dashboard-demo.mp4
            poster: assets/projects/berry-street/dashboard-poster.webp
            width: 1440
            height: 1044
            caption:
              en: The refined prototype switches between doughnut and bar charts within an enlarged classroom readiness view.
              zh: 改进后的交互原型可在放大的班级学习准备度视图中切换环形图与柱状图。

  - id: avl-visualisation
    published: true
    name: {en: 'Algorithms in Action — AVL Trees', zh: 'Algorithms in Action（AVL 树可视化）'}
    logo:
      src: assets/projects/avl-visualisation/aia-mark.webp
      width: 300
      height: 300
      alt: {en: Algorithms in Action project mark, zh: Algorithms in Action 项目标识}
    date: {en: 'Aug 2024 – Oct 2024', zh: '2024年8月 – 2024年10月'}
    region: au
    type: team
    team: {en: Static Sound, zh: Static Sound}
    members:
      - name: {en: Hao Chen, zh: Hao Chen}
        url: https://github.com/JarrettChen217
      - name: {en: Ziyu Wang, zh: Ziyu Wang}
        url: https://github.com/Lafinoon
      - name: {en: Jiayi Sun, zh: Jiayi Sun}
        url: https://github.com/JiayiSun666
      - name: {en: Junhao Zhu, zh: Junhao Zhu}
        url: https://github.com/junhaozhu1
      - name: {en: Gaoyongle Zhang, zh: Gaoyongle Zhang}
        url: https://github.com/XinMoZ
    tech: React, JavaScript, AVL trees
    keywords: [algorithms, animation, education, 算法, 可视化]
    summary:
      en: Visualising AVL insertion and rebalancing in an algorithm teaching platform.
      zh: 在算法教学平台中可视化 AVL 插入与平衡调整。
    background:
      en: The project extends an existing binary-search-tree teaching module with AVL behaviour, animated rotations, and step-by-step pseudocode playback.
      zh: 项目在已有二叉搜索树教学模块上扩展 AVL 行为、旋转动画及分步伪代码回放。
    work:
      - en: Contributed to the AVL insertion controller and recursive pseudocode as part of the algorithm programming pair.
        zh: 作为算法编程结对成员，参与 AVL 插入控制器与递归伪代码开发。
      - en: Collaborated on step-by-step rotation animations and the integration between algorithm logic and the visual interface.
        zh: 协作实现分步旋转动画，衔接算法逻辑与可视化界面。
      - en: Served as Scrum Master and corrected recursive playback navigation behaviour.
        zh: 担任 Scrum Master，并修复递归回放导航行为。
    journey:
      - title: {en: Bringing AVL rotations into view, zh: 让 AVL 旋转过程可见}
        body:
          en: Working with a teammate, I implemented intermediate rotation steps in the controller so learners could follow how nodes move during rebalancing. We traced the algorithm and visual state together to connect the rotation sequence with the teaching interface. This contributed to the team's AVL extension of the existing binary-search-tree module.
          zh: 我与队友一起在控制器中实现旋转的中间步骤，让学习者能够跟随节点移动，理解重新平衡的过程。我们共同梳理算法与图形状态，将旋转流程连接到教学界面，完成团队在原有二叉搜索树模块上的一部分 AVL 扩展。
      - title: {en: Supporting recursive step-by-step playback, zh: 完善递归算法的分步回放}
        body:
          en: I resolved a chunk-depth navigation issue introduced when the algorithm was adapted to recursive pseudocode, supporting step-by-step exploration of the algorithm. The work involved tracing recursion depth and checking navigation through folded code. Alongside implementation, I coordinated weekly progress as Scrum Master and helped turn client feedback into team tasks.
          zh: 在算法适配递归伪代码的过程中，我解决了 chunk 深度导致的导航问题，支持算法的分步探索。实现时追踪递归层级，并检查折叠代码中的导航行为。同时，我作为 Scrum Master 协调每周进展，协助将客户反馈转化为团队任务。

      - title: {en: A traceable route from tasks to delivery, zh: 从任务到交付的可追踪流程}
        body:
          en: The team used Confluence for requirements, sprint reports and handover notes, while Jira linked implementation tasks to commits and deployment status. Separate stable and development previews supported client reviews. Controller tests checked tree outputs across rotation cases, and the handover documented the interfaces needed for continued development.
          zh: 团队使用 Confluence 整理需求、冲刺报告和交接说明，通过 Jira 将实现任务关联到提交与部署状态；稳定版和开发版预览支持客户评审。控制器测试检查不同旋转场景下的树输出，交接文档则记录后续开发所需的接口。
      - title: {en: From the course project to Algorithms in Action, zh: 从课程项目到 Algorithms in Action}
        body:
          en: Our team's AVL changes were merged into Algorithms in Action. Later maintainers rewrote parts of the module in 2025. The team repository records our course work, and the live demo shows the version maintained upstream.
          zh: 我们团队的 AVL 改动已合入 Algorithms in Action。2025 年，后续维护者重写了部分模块。小组仓库保留了课程期间的工作记录，在线演示展示的是上游维护的版本。
    linkPlacement: top
    links:
      - label: {en: Try the AVL animation, zh: 体验 AVL 动画}
        url: https://dev-aia.vercel.app/animation/?alg=AVLTree&mode=operations
      - label: {en: Course team repository, zh: 课程小组仓库}
        url: https://github.com/JarrettChen217/ITP_team025_staticsound
      - label: {en: Algorithms in Action upstream, zh: Algorithms in Action 上游仓库}
        url: https://github.com/algorithms-in-action/algorithms-in-action.github.io
    architecture:
      - title: {en: Controller & pseudocode, zh: 控制器与伪代码}
        body:
          en: The insertion controller expresses the algorithm as an ordered sequence, with bookmarks linking execution to the displayed recursive pseudocode.
          zh: 插入控制器将算法组织成有序步骤，通过书签将执行过程关联到界面中的递归伪代码。
      - title: {en: Chunker playback, zh: Chunker 分步播放}
        body:
          en: Each playback step triggers its scheduled actions, coordinating code highlighting with changes to the tree state.
          zh: 每个播放步骤触发对应动作，将代码高亮与树状态变化协调起来。
      - title: {en: GraphTracer & renderer, zh: GraphTracer 与图形渲染}
        body:
          en: Extensions to the existing visual framework present node positions, heights, balance information and intermediate rotation states.
          zh: 在已有可视化框架上扩展节点位置、高度、平衡信息与旋转中间状态的呈现。
    demo:
      src: assets/projects/avl-visualisation/avl-insertion-demo.mp4
