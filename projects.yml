      label: {en: Play Game, zh: 在线试玩}
    sectionOrder: [background, mechanics, process, video, demo, product, contributions, journey, engineering, team, credits]
    demo:
      src: assets/projects/midas-curse-unity/gold-path-demo.mp4
      poster: assets/projects/midas-curse-unity/gold-path-800.webp
      width: 960
      height: 540
      caption:
        en: >-
          An early Unity prototype of the golden-path mechanic: movement leaves transformed ground that becomes both a resource and a hazard.
        zh: 黄金路径机制的早期 Unity 原型：移动会在身后留下被转化的地面，使路径同时成为资源与风险。
    journey:
      - title: {en: Two stages of one game, zh: 同一游戏的两个开发阶段}
        body:
          en: Project 1 moved from the Midas-inspired premise to a playable prototype of movement, the golden path, the maze, and survival feedback. Project 2 carried the same foundation into a broader game loop with staged progression, combat, enemies, item upgrades, and a boss encounter.
          zh: Project 1 将 Midas 灵感推进为包含移动、黄金路径、迷宫与生存反馈的可玩原型；Project 2 延续同一基础，进一步形成带有阶段推进、战斗、敌人、道具升级与 Boss 战的完整玩法循环。
      - title: {en: Refining feedback through playtesting, zh: 通过试玩反馈完善视觉提示}
        body:
          en: The team used face-to-face playtesting and a survey to guide the later iteration. One visible refinement made the affected ground easier to distinguish through stronger colour contrast and particle feedback, helping players read the golden-path state while moving.
          zh: 团队通过面对面试玩与问卷反馈指导后续迭代。其中一项可见改进通过更鲜明的颜色对比与粒子反馈区分受影响地面，帮助玩家在移动过程中判断黄金路径状态。
