<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Retrieval replay · Agent AI</title>
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./run-data.js"></script>
  <script defer src="./replay.js"></script>
</head>
<body>
  <header>
    <a href="../../#project/agent-ai" id="back">← Agent AI</a>
    <div class="languages" role="group" aria-label="Language / 语言">
      <button type="button" data-lang="en" lang="en">English</button>
      <button type="button" data-lang="zh" lang="zh">中文</button>
    </div>
  </header>
  <main>
    <h1 id="title"></h1>
    <p class="intro" id="intro"></p>
    <a href="./physics-notes.pdf" id="source"></a>
    <div class="reader">
      <section class="question">
        <label for="choose" id="choose-label"></label>
        <select id="choose"></select>
        <h2 id="question" lang="en"></h2>
        <h3 id="gold-title"></h3>
        <p id="gold"></p>
      </section>
      <section class="results" aria-labelledby="rank-title">
        <h2 id="rank-title"></h2>
        <p class="hint" id="hint"></p>
        <ol id="ranked"></ol>
      </section>
    </div>
  </main>
</body>
</html>
