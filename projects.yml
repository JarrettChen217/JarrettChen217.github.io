          en: The refined result gives the affected path stronger contrast and particle feedback so its state is easier to read in motion.
          zh: 改进结果通过更强的颜色对比与粒子反馈突出受影响路径，使玩家在移动中更容易判断其状态。
      - src: assets/projects/midas-curse-unity/team-cosmic-creators-reunion-1600.webp
