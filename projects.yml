      zh: 本项目为教学工程原型，不主张临床验证结果或医疗器械能力。

  - id: berry-street
    published: true
    name: {en: Berry Street Teachers App, zh: Berry Street Teachers App（教师应用设计）}
    logo:
      src: assets/projects/berry-street/wombat-mark.webp
      width: 380
      height: 236
      alt: {en: Wombat team mark, zh: Wombat 团队标识}
    date: {en: 'Feb 2025 – Aug 2025', zh: '2025年2月 – 2025年8月'}
    region: au
    type: team
    tech: Requirements engineering, Agile/Scrum, Figma
    keywords: [leadership, design, UX, 需求, 团队协作]
    summary:
      en: Requirements and interaction design for an iPad-oriented education application.
      zh: 面向 iPad 教育应用的需求分析与交互设计。
    background:
      en: This university–client collaboration was grounded in Trauma-Informed Positive Education (TIPE), a strengths-based approach that supports students’ regulation, relationships, wellbeing and engagement with learning. Students affected by stress or adversity may find it difficult to identify or communicate how they feel and whether they are ready to learn. Our project therefore explored a simple, non-judgemental digital check-in through which students could express their current readiness, while giving teachers a clearer view of the support their class might need.
      zh: 这是一个以 Trauma-Informed Positive Education（TIPE，创伤知情积极教育）为背景的大学客户合作项目。TIPE 是一种以优势为基础的教育方法，关注学生的情绪调节、人际关系、身心健康与学习参与。受到压力或不利经历影响的学生，有时难以及时识别和表达自己的感受，以及自己是否已经准备好进入学习状态。因此，本项目探索了一种简单且非评判性的数字签到方式，让学生表达当下的学习准备度，同时帮助教师更清楚地了解班级可能需要的支持。
    backgroundLink:
      label: {en: Learn about the TIPE approach, zh: 了解 TIPE 教育方法}
      url: https://pursuit.unimelb.edu.au/articles/Trauma-follows-children-into-the-classroom.-A-new-teaching-model-is-changing-that
    members:
      - name: {en: Ziyu Wang, zh: Ziyu Wang}
      - name: {en: Hao Chen, zh: Hao Chen}
        url: https://github.com/JarrettChen217
      - name: {en: Zikun Qiu, zh: Zikun Qiu}
      - name: {en: Gaoyongle Zhang, zh: Gaoyongle Zhang}
        url: https://github.com/XinMoZ
      - name: {en: Junhao Zhu, zh: Junhao Zhu}
        url: https://github.com/junhaozhu1
    work: []
    process:
      heading: {en: From discovery to validation, zh: 从需求发现到方案验证}
      intro:
        en: The project moved through five connected stages. Each stage turned client context and user feedback into a more focused, testable design decision.
        zh: 项目沿着五个彼此衔接的阶段推进；每一阶段都把客户背景与用户反馈进一步转化为更聚焦、可验证的设计决策。
      stages:
        - id: discover
          label: {en: Discover, zh: 探索}
          title: {en: Start with the classroom need, zh: 从真实课堂需求出发}
          body:
            en: >-
              Early client conversations established the central need: a private, low-pressure way for students to communicate readiness to learn, paired with a teacher view that reveals class-level patterns without making the interaction difficult to use.
            zh: 前期客户交流明确了核心需求：学生需要一种私密、低压力的方式表达自己的学习准备度；教师则需要看到班级层面的趋势，同时整个交互必须保持简单易用。
          contribution:
            en: As Scrum Master, I coordinated discussions and sprint activities and helped turn client priorities into requirements the team could track.
            zh: 作为 Scrum Master，我协调讨论与冲刺活动，并协助把客户重点转化为团队可持续跟踪的需求。
          findings:
            - {en: Student check-ins should feel private and non-judgemental., zh: 学生签到应当保持私密且不带评判。}
            - {en: The interface needed to work for teachers with different levels of technical confidence., zh: 界面需要适应不同技术熟练度的教师。}
            - {en: Teachers needed both individual signals and class-level trends., zh: 教师既需要个体提示，也需要班级整体趋势。}
          gallery:
            - src: assets/projects/berry-street/goal-model-1600.webp
              thumbnail: assets/projects/berry-street/goal-model-800.webp
              width: 1600
              height: 368
              thumbnailWidth: 800
              alt: {en: Goal model connecting stakeholder roles with functional and emotional goals, zh: 关联利益相关方角色、功能目标与情感目标的目标模型}
              caption:
                en: The goal model connects students, teachers, school administrators and support teams with the functions and experiences the product should support.
                zh: 目标模型将学生、教师、学校管理者与支持团队关联到产品应支持的功能与体验目标。

        - id: define
          label: {en: Define, zh: 定义}
          title: {en: Translate needs into roles and stories, zh: 将需求整理为角色与用户故事}
          body:
            en: The team organised the problem around student, teacher and administrator roles, then connected their desired actions and feelings to epics, user stories and sprint tasks. This kept the design grounded in what each person needed to do and experience.
            zh: 团队围绕学生、教师与管理者三类角色梳理问题，再把他们期望完成的行为与获得的感受对应到 Epic、用户故事和冲刺任务，使设计始终围绕各角色真实的使用目标展开。
          contribution:
            en: I helped organise user stories, acceptance criteria, personas and journey materials so requirements could guide prototype and testing work.
            zh: 我参与整理用户故事、验收标准、用户画像与旅程材料，使需求能够持续指导原型和测试工作。
          gallery:
            - src: assets/projects/berry-street/role-do-be-feel-1600.webp
              thumbnail: assets/projects/berry-street/role-do-be-feel-800.webp
              width: 1530
              height: 1980
              thumbnailWidth: 765
              alt: {en: Role–Do–Be–Feel model for the student, teacher and administrator experience, zh: 面向学生、教师与管理者体验的 Role–Do–Be–Feel 模型}
              caption:
                en: Role–Do–Be–Feel connected stakeholder actions with the qualities and feelings the interface should support.
                zh: Role–Do–Be–Feel 模型将不同角色的行为，与界面应传达的特质和感受联系起来。
            - src: assets/projects/berry-street/user-story-map-1600.webp
              thumbnail: assets/projects/berry-street/user-story-map-800.webp
              width: 1600
              height: 1132
              thumbnailWidth: 800
              alt: {en: User story map arranging epics, stories and sprint tasks, zh: 按 Epic、用户故事与冲刺任务组织的用户故事地图}
              caption:
                en: The story map traces broad activities into prioritised work across three sprints.
                zh: 用户故事地图把整体活动拆解为跨三个冲刺逐步推进的优先任务。

        - id: prototype
          label: {en: Prototype, zh: 原型}
          title: {en: Make the core flows tangible, zh: 把核心流程变成可讨论的原型}
          body:
            en: Low-fidelity screens made the student check-in and teacher dashboard concrete enough to review. The deliberately rough presentation kept attention on navigation, wording and information hierarchy before visual polish.
            zh: 低保真页面把学生签到与教师仪表盘转化为可直接评审的流程。刻意保留的粗略视觉，让讨论先集中在导航、文案与信息层级，而不是过早进入视觉润色。
          contribution:
            en: I contributed to prototype direction and privacy-related design discussions, helping prepare the student and teacher flows for usability testing.
            zh: 我参与原型方向与隐私相关的设计讨论，并协助准备学生端和教师端流程进入可用性测试。
          gallery:
            - src: assets/projects/berry-street/lofi-check-in-1600.webp
              thumbnail: assets/projects/berry-street/lofi-check-in-800.webp
              width: 1600
              height: 1104
              thumbnailWidth: 800
              alt: {en: Low-fidelity student readiness check-in screen, zh: 学生学习准备度签到的低保真页面}
              caption:
                en: An early check-in explored how a primary-school student could report readiness with a single selection.
                zh: 早期签到页面探索了小学生通过一次选择表达学习准备度的方式。
            - src: assets/projects/berry-street/lofi-dashboard-1600.webp
              thumbnail: assets/projects/berry-street/lofi-dashboard-800.webp
              width: 1600
              height: 1104
              thumbnailWidth: 800
              alt: {en: Low-fidelity teacher classroom readiness dashboard, zh: 教师班级学习准备度仪表盘的低保真页面}
              caption:
                en: The initial dashboard brought response counts, a chart, trend history and a notice area into one teacher view.
                zh: 初版仪表盘将回答数量、图表、历史趋势与提示区域整合到同一个教师视图中。

        - id: test-and-learn
          label: {en: Test & learn, zh: 测试与学习}
          title: {en: Observe where the design caused hesitation, zh: 观察设计中引发犹豫的地方}
          body:
            en: During the 7 May usability session, the client worked through student and teacher tasks while the team recorded points of confidence and confusion. The session exposed which parts of the dashboard needed clearer visual and verbal cues.
            zh: 在 5 月 7 日的可用性测试中，客户依次完成学生端与教师端任务，团队记录顺畅之处及产生困惑的环节。这次测试明确指出了仪表盘在视觉和文字提示上需要改进的部分。
          contribution:
            en: I facilitated the low-fidelity usability session and helped connect the observations to the next iteration.
            zh: 我主持了这次低保真可用性测试，并协助把观察结果衔接到下一轮迭代。
          findings:
            - {en: The dashboard contained too much competing information at once., zh: 仪表盘同时呈现的信息过多，视觉焦点不够清晰。}
            - {en: Readiness scales and response counts were easy to confuse., zh: 学习准备度等级与回答数量容易产生混淆。}
            - {en: Trend labels needed clearer wording and context., zh: 趋势图标签需要更明确的文案和语境。}
          gallery:
            - src: assets/projects/berry-street/usability-dashboard-test-1600.webp
              thumbnail: assets/projects/berry-street/usability-dashboard-test-800.webp
              width: 1600
              height: 1280
              thumbnailWidth: 800
              alt: {en: Privacy-cropped frame from the teacher dashboard usability task, zh: 隐私裁切后的教师仪表盘可用性测试画面}
              caption:
                en: A privacy-cropped session frame retains the tested dashboard and task context while excluding participant video feeds.
                zh: 经过隐私裁切的测试画面保留了被测试的仪表盘与任务场景，并移除了参与者的视频画面。
            - src: assets/projects/berry-street/usability-planning-1600.webp
              thumbnail: assets/projects/berry-street/usability-planning-800.webp
              width: 1600
              height: 1200
              thumbnailWidth: 800
              alt: {en: Whiteboard mapping student and teacher usability tasks to prototype refinements, zh: 梳理学生及教师可用性任务与原型改进的白板}
              caption:
                en: The team linked student and teacher usability tasks to action items for the next prototype iteration.
                zh: 团队把学生端与教师端的测试任务衔接到下一轮原型的行动项。

        - id: refine-and-validate
          label: {en: Refine & validate, zh: 改进与验证}
          title: {en: Turn feedback into a clearer handover, zh: 将反馈转化为更清晰的交付方案}
          body:
            en: The revised dashboard removed the wellbeing score, clarified labels and added a bar-chart option alongside the doughnut view. In the final client walkthrough, the histogram was considered easier to read, the three-option student scale suited primary users, and the central workflow was accepted for handover.
            zh: 改进后的仪表盘移除了 wellbeing score，明确了标签，并在环形图之外增加柱状图选项。最终客户演示中，柱状图被认为更易阅读，三个选项的学生签到方式也更适合小学生，核心流程获得认可并进入交接。
          contribution:
            en: I helped carry usability findings into the refinement work and, as Scrum Master, coordinated requirements, testing and handover activities across the sprint.
            zh: 我协助把可用性测试结论落实到改进工作中，并以 Scrum Master 身份协调冲刺中的需求、测试与交接活动。
          findings:
            - {en: A simpler three-option check-in better matched primary-school use., zh: 更简洁的三个选项更符合小学阶段的使用场景。}
            - {en: The bar chart made the response distribution easier to compare., zh: 柱状图让回答分布更容易比较。}
            - {en: Further reduction of visual clutter remained an accessibility opportunity., zh: 继续减少视觉干扰仍是后续无障碍优化方向。}
          gallery:
            - src: assets/projects/berry-street/hifi-dashboard-1600.webp
              thumbnail: assets/projects/berry-street/hifi-dashboard-800.webp
              width: 1600
              height: 1104
              thumbnailWidth: 800
              alt: {en: Refined high-fidelity classroom readiness dashboard, zh: 改进后的高保真班级学习准备度仪表盘}
              caption:
                en: The high-fidelity dashboard uses clearer labels, a reduced readiness scale and a more approachable visual system.
                zh: 高保真仪表盘采用更明确的标签、更精简的准备度等级与更亲和的视觉系统。
            - src: assets/projects/berry-street/team-with-max-1600.webp
              thumbnail: assets/projects/berry-street/team-with-max-800.webp
              width: 1600
              height: 1067
              thumbnailWidth: 800
              alt: {en: Berry Street project team with supervisor Max, zh: Berry Street 项目团队与导师 Max 的合照}
              caption: {en: The Wombat team with our supervisor Max., zh: Wombat 团队与导师 Max 合影。}
          demo:
            src: assets/projects/berry-street/dashboard-demo.mp4
            poster: assets/projects/berry-street/dashboard-poster.webp
            width: 1440
            height: 1044
            caption:
              en: The refined prototype switches between doughnut and bar charts within an enlarged classroom readiness view.
              zh: 改进后的交互原型可在放大的班级学习准备度视图中切换环形图与柱状图。

  - id: avl-visualisation
    published: true
    name: {en: 'Algorithms in Action — AVL Trees', zh: 'Algorithms in Action（AVL 树可视化）'}
    logo:
      src: assets/projects/avl-visualisation/aia-mark.webp
      width: 300
      height: 300
      alt: {en: Algorithms in Action project mark, zh: Algorithms in Action 项目标识}
    date: {en: 'Aug 2024 – Oct 2024', zh: '2024年8月 – 2024年10月'}
    region: au
    type: team
    tech: React, JavaScript, AVL trees
    keywords: [algorithms, animation, education, 算法, 可视化]
    summary:
      en: Visualising AVL insertion and rebalancing in an algorithm teaching platform.
      zh: 在算法教学平台中可视化 AVL 插入与平衡调整。
    background:
      en: The project extends an existing binary-search-tree teaching module with AVL behaviour, animated rotations, and step-by-step pseudocode playback.
      zh: 项目在已有二叉搜索树教学模块上扩展 AVL 行为、旋转动画及分步伪代码回放。
    work:
      - en: Contributed to the AVL insertion controller and recursive pseudocode as part of the algorithm programming pair.
        zh: 作为算法编程结对成员，参与 AVL 插入控制器与递归伪代码开发。
      - en: Collaborated on step-by-step rotation animations and the integration between algorithm logic and the visual interface.
        zh: 协作实现分步旋转动画，衔接算法逻辑与可视化界面。
      - en: Served as Scrum Master and corrected recursive playback navigation behaviour.
        zh: 担任 Scrum Master，并修复递归回放导航行为。
    journey:
      - title: {en: Bringing AVL rotations into view, zh: 让 AVL 旋转过程可见}
        body:
          en: Working with a teammate, I implemented intermediate rotation steps in the controller so learners could follow how nodes move during rebalancing. We traced the algorithm and visual state together to connect the rotation sequence with the teaching interface. This contributed to the team's AVL extension of the existing binary-search-tree module.
          zh: 我与队友一起在控制器中实现旋转的中间步骤，让学习者能够跟随节点移动，理解重新平衡的过程。我们共同梳理算法与图形状态，将旋转流程连接到教学界面，完成团队在原有二叉搜索树模块上的一部分 AVL 扩展。
      - title: {en: Supporting recursive step-by-step playback, zh: 完善递归算法的分步回放}
        body:
          en: I resolved a chunk-depth navigation issue introduced when the algorithm was adapted to recursive pseudocode, supporting step-by-step exploration of the algorithm. The work involved tracing recursion depth and checking navigation through folded code. Alongside implementation, I coordinated weekly progress as Scrum Master and helped turn client feedback into team tasks.
          zh: 在算法适配递归伪代码的过程中，我解决了 chunk 深度导致的导航问题，支持算法的分步探索。实现时追踪递归层级，并检查折叠代码中的导航行为。同时，我作为 Scrum Master 协调每周进展，协助将客户反馈转化为团队任务。

      - title: {en: A traceable route from tasks to delivery, zh: 从任务到交付的可追踪流程}
        body:
          en: The team used Confluence for requirements, sprint reports and handover notes, while Jira linked implementation tasks to commits and deployment status. Separate stable and development previews supported client reviews. Controller tests checked tree outputs across rotation cases, and the handover documented the interfaces needed for continued development.
          zh: 团队使用 Confluence 整理需求、冲刺报告和交接说明，通过 Jira 将实现任务关联到提交与部署状态；稳定版和开发版预览支持客户评审。控制器测试检查不同旋转场景下的树输出，交接文档则记录后续开发所需的接口。
    architecture:
      - title: {en: Controller & pseudocode, zh: 控制器与伪代码}
        body:
          en: The insertion controller expresses the algorithm as an ordered sequence, with bookmarks linking execution to the displayed recursive pseudocode.
          zh: 插入控制器将算法组织成有序步骤，通过书签将执行过程关联到界面中的递归伪代码。
      - title: {en: Chunker playback, zh: Chunker 分步播放}
        body:
          en: Each playback step triggers its scheduled actions, coordinating code highlighting with changes to the tree state.
          zh: 每个播放步骤触发对应动作，将代码高亮与树状态变化协调起来。
      - title: {en: GraphTracer & renderer, zh: GraphTracer 与图形渲染}
        body:
          en: Extensions to the existing visual framework present node positions, heights, balance information and intermediate rotation states.
          zh: 在已有可视化框架上扩展节点位置、高度、平衡信息与旋转中间状态的呈现。
    demo:
      src: assets/projects/avl-visualisation/avl-insertion-demo.mp4
      poster: assets/projects/avl-visualisation/avl-insertion-poster.webp
      width: 1440
      height: 1022
      caption:
        en: Watch AVL insertion and rebalancing, with tree rotations and step-by-step pseudocode highlighting.
        zh: 演示 AVL 节点插入与重新平衡，结合树旋转动画和逐步高亮的伪代码。
    gallery:
