<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Tetress Part B MCTS class model</title>
  <desc id="desc">A UML-style class diagram showing Agent, TreeNode, Tetrominos, and the Monte Carlo tree search function.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#527288"/></marker>
    <style>
      .bg{fill:#f7fafb}.title{font:700 36px Arial,sans-serif;fill:#1d3443}.sub{font:400 18px Arial,sans-serif;fill:#657986}.head{font:700 22px Arial,sans-serif;fill:#1d3443}.sidehead{font:700 19px Arial,sans-serif;fill:#1d3443}.field{font:400 16px Arial,sans-serif;fill:#46606f}.method{font:400 16px Arial,sans-serif;fill:#355365}.stereo{font:600 15px Arial,sans-serif;fill:#4a91a2}.box{fill:#fff;stroke:#a9c0cc;stroke-width:2}.accent{fill:#e7f3f6;stroke:#4a91a2;stroke-width:2}.mint{fill:#e9f6f0;stroke:#4c957b;stroke-width:2}.line{fill:none;stroke:#527288;stroke-width:2.5;marker-end:url(#arrow)}.dash{fill:none;stroke:#7893a2;stroke-width:2;stroke-dasharray:7 7;marker-end:url(#arrow)}.rule{stroke:#cbdbe2;stroke-width:1.5}.note{font:600 15px Arial,sans-serif;fill:#527288}
    </style>
  </defs>
  <rect class="bg" width="1400" height="900" rx="24"/>
  <text class="title" x="72" y="82">Part B · MCTS class model</text><text class="sub" x="72" y="116">Agent-owned tree reuse, board updates, and selection / simulation bookkeeping</text>
  <rect class="accent" x="88" y="190" width="350" height="410" rx="14"/><text class="stereo" x="116" y="226">«entry point»</text><text class="head" x="116" y="258">Agent</text><line class="rule" x1="88" y1="278" x2="438" y2="278"/>
  <text class="field" x="116" y="313">− _color : PlayerColor</text><text class="field" x="116" y="341">− board : dict&lt;Coord, Color&gt;</text><text class="field" x="116" y="369">− tetrominos : Tetrominos</text><text class="field" x="116" y="397">− tree_root : TreeNode | None</text><text class="field" x="116" y="425">− level, simulation_cost</text><line class="rule" x1="88" y1="447" x2="438" y2="447"/>
  <text class="method" x="116" y="482">+ action(referee) : PlaceAction</text><text class="method" x="116" y="510">+ update(color, action)</text><text class="method" x="116" y="538">  apply action + clear lines</text><text class="method" x="116" y="566">  reuse matching child or reset</text>
  <rect class="box" x="560" y="166" width="380" height="550" rx="14"/><text class="stereo" x="588" y="202">«tree node»</text><text class="head" x="588" y="234">TreeNode</text><line class="rule" x1="560" y1="254" x2="940" y2="254"/>
  <text class="field" x="588" y="289">+ state : board state</text><text class="field" x="588" y="317">+ parent : TreeNode | None</text><text class="field" x="588" y="345">+ children : TreeNode[]</text><text class="field" x="588" y="373">+ playouts, wins, level</text><text class="field" x="588" y="401">+ curr_action : TetroPiece</text><text class="field" x="588" y="429">− _untried_actions</text><line class="rule" x1="560" y1="451" x2="940" y2="451"/>
  <text class="method" x="588" y="486">+ select(c) : TreeNode</text><text class="method" x="588" y="514">+ expand_child() : TreeNode</text><text class="method" x="588" y="542">+ simulate() : winner, rounds</text><text class="method" x="588" y="570">+ backpropagate(winner)</text><text class="method" x="588" y="598">+ best_child(c) : TreeNode</text><text class="method" x="588" y="626">+ calculate_ucb_score(c)</text><text class="method" x="588" y="654">+ best_tree_node_next()</text>
  <rect class="mint" x="990" y="190" width="330" height="210" rx="14"/><text class="stereo" x="1018" y="226">«function»</text><text class="sidehead" x="1018" y="258">monte_carlo_tree_search</text><line class="rule" x1="990" y1="278" x2="1320" y2="278"/><text class="field" x="1018" y="313">previous tree or new root</text><text class="field" x="1018" y="341">time-based simulation budget</text><text class="field" x="1018" y="369">best node + simulation count</text>
  <rect class="box" x="990" y="515" width="330" height="166" rx="14"/><text class="stereo" x="1018" y="551">«piece library»</text><text class="sidehead" x="1018" y="583">Tetrominos / TetroPiece</text><line class="rule" x1="990" y1="603" x2="1320" y2="603"/><text class="field" x="1018" y="635">piece templates + origins</text><text class="field" x="1018" y="663">legal placements + board update</text>
  <path class="line" d="M438 340 H560"/><text class="note" x="456" y="325">owns root</text><path class="line" d="M438 400 H530 V675 H560"/><text class="note" x="466" y="663">uses</text>
  <path class="line" d="M438 290 H500 V120 H1155 V190"/><text class="note" x="872" y="109">calls</text><path class="line" d="M990 315 H940"/><text class="note" x="948" y="300">drives</text><path class="dash" d="M940 615 H970 V470 H1155 V515"/><text class="note" x="984" y="458">generates legal moves</text>
  <text class="note" x="88" y="830">UCB selection and random simulation live on TreeNode; Agent maintains the board, timing estimate, and reusable tree root across turns.</text>
</svg>
