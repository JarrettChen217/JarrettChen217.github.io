projects:
  - id: zooxr
    published: true
    name: {en: ZooXR, zh: ZooXR（跨设备动物园）}
    date: {en: Feb – Apr 2026 · Columbia University · COMS W4172, zh: 2026年2月 – 2026年4月 · 哥伦比亚大学 · COMS W4172}
    region: ny
    type: academic
    tech: Unity, ARKit, iOS, JSON, Meta Quest 3
    keywords: [AR, VR, XR, zoo, augmented reality, virtual reality, 动物园, 增强现实, 虚拟现实]
    summary:
      en: Lay out a zoo in augmented reality on an iPad or iPhone, then put on a Quest 3 and visit the zoo you just designed.
      zh: 先在 iPad 或 iPhone 的增强现实画面里搭一座动物园，再戴上 Quest 3，走进自己刚刚布置的园区。
    background:
      en: ZooXR began as a Columbia University 3D user interfaces assignment. It gives the designer and the visitor different views of one place. The phone shows the layout against the real surroundings while the headset puts the visitor inside it.
      zh: ZooXR 是哥伦比亚大学三维用户界面课程的作业。设计者和游客看到的是同一座园区的两个视角。拿起手机时，可以对照眼前的真实空间安排布局；戴上头显后，就能从游客的视角看这座动物园。
    work: []
    process:
      kicker: {en: Across two devices, zh: 跨设备体验}
      heading: {en: How the phone-built zoo reaches the headset, zh: 手机里搭的动物园怎样进入头显}
      intro:
        en: Two Unity applications share a layout file. The iOS builder writes it when the design is ready. The Quest explorer reads it to open that design in VR.
        zh: 两个 Unity 应用通过一份布局文件交接。园区搭好后，iOS 搭建器把布局写入文件，Quest 游览器再读取它，让这座园区出现在 VR 里。
      diagram:
        alt:
          en: Sequence diagram showing the designer placing zoo objects on iOS, exporting their layout as JSON, transferring the file to Quest 3 and opening the reconstructed zoo in VR.
          zh: 时序图从上到下展示设计者在 iOS 摆放园区物体、导出 JSON 布局、将文件传到 Quest 3，以及游览器读取布局并在 VR 中还原园区的过程。
        caption:
          en: Follow a layout from the moment the designer saves it on the phone to the moment a visitor sees it in the headset.
          zh: 从设计者在手机上保存布局，到游客在头显里看到园区，图中的箭头标出每一步由谁完成。
      stages:
        - id: build
          label: {en: iOS · ARKit, zh: iOS · ARKit}
          title: {en: Lay out the zoo on iPad, zh: 在 iPad 上布置园区}
          body:
            en: The builder runs on iOS. Looking through the iPad camera, the designer places enclosures and animals in AR and can see where they sit relative to each other before saving.
            zh: 搭建器运行在 iOS 上。透过 iPad 摄像头，设计者可以在增强现实画面里摆放围栏和动物，保存前就能看到它们彼此的位置。
          gallery:
            - src: assets/projects/zooxr/layout.webp
              thumbnail: assets/projects/zooxr/layout-thumb.webp
              width: 960
              height: 1320
              thumbnailWidth: 480
              alt:
                en: Dogs inside a grassy enclosure in the iPad AR builder
                zh: iPad 的 AR 搭建画面中，几只狗位于草地围栏内
              caption:
                en: Start at one enclosure. The placement grid shows where the builder can position objects in the camera view.
                zh: 从一处围栏开始看。草地上的狗和画面里的定位点，让人能看清搭建时物体放在哪里。
            - src: assets/projects/zooxr/path-edit.webp
              thumbnail: assets/projects/zooxr/path-edit-thumb.webp
              width: 940
              height: 744
              thumbnailWidth: 600
              alt:
                en: The iPad builder in path-editing mode
                zh: iPad 搭建器中的道路编辑画面
              caption:
                en: Once all three enclosures are in place, the designer can lay path tiles between them. The enclosure floors stay fixed during this step.
                zh: 三个围区就位后，可以在它们之间铺设路面。编辑道路时，围区地板会锁定，避免铺路过程中把围区挪走。
            - src: assets/projects/zooxr/builder.webp
              thumbnail: assets/projects/zooxr/builder-thumb.webp
              width: 1280
              height: 960
              thumbnailWidth: 640
              alt: {en: iOS AR view of a deer with a green checklist and the layout menu open, zh: iOS 增强现实画面里的一头鹿、绿色检查表和打开的布局菜单}
              caption:
                en: The builder shows the placement checks in green. With the layout ready, the designer can choose “Export layout (share)” from the open menu.
                zh: 搭建检查表上的项目已变绿。在打开的菜单中点「Export layout (share)」，就能分享搭好的布局。
        - id: transfer
          label: {en: JSON, zh: JSON}
          title: {en: Pass the layout from one device to the other, zh: 把园区布局交给另一台设备}
          body:
            en: The iOS share sheet exports the layout as JSON. A Mac copies the file into the Quest app’s storage with Android Debug Bridge (ADB). Each record identifies an object and gives its position, rotation and scale relative to the zoo. One animal in the saved layout is a deer in enclosure 1. The headset can place that deer without knowing where the phone was in the room.
            zh: 通过 iOS 分享面板导出 JSON 布局后，在 Mac 上用 Android 调试桥（ADB）把文件传入 Quest 应用的存储目录。文件逐项记录物体的类型，以及相对于园区的位置、朝向和缩放。实际保存的布局里有一头鹿属于 1 号围栏。有了这条记录，头显就能把鹿放回园区里的位置，无需知道当时手机在房间的哪一处。
          gallery:
            - src: assets/projects/zooxr/layout-map.webp
              thumbnail: assets/projects/zooxr/layout-map-thumb.webp
              width: 1200
              height: 900
              thumbnailWidth: 600
              alt:
                en: Plan of the three enclosures drawn from the exported layout
                zh: 根据导出布局绘制的俯视图，标出了三个围区
              caption:
                en: The saved X/Z coordinates seen from above. Numbers identify enclosures, red dots mark animals, blue diamonds mark gates, green lines mark fences and brown tiles trace the path.
                zh: 这张俯视图根据导出文件中的 X/Z 坐标绘制。数字对应围区编号，红点是动物，蓝色菱形是门，绿线是围栏，棕色短条标出游览路径。
        - id: explore
          label: {en: Meta Quest 3, zh: Meta Quest 3}
          title: {en: Step inside the saved design, zh: 走进刚才保存的动物园}
          body:
            en: On startup, the Quest app reads each record, looks up the matching Unity prefab and places an instance at the saved pose. It restores the deer’s enclosure assignment, then rebuilds the navigation mesh around the placed enclosures and obstacles. The visitor can approach the enclosure in VR and see it from the gate.
            zh: Quest 应用启动时逐条读取布局，按标识找到对应的 Unity 预制件，在保存的位置和朝向上放置实例，并恢复鹿与 1 号围栏的关联。围栏和障碍物全部就位后，应用再重建标示可行走区域的导航网格。游客可以走近围栏，从门边向里看。
          gallery:
            - src: assets/projects/zooxr/explorer.webp
              thumbnail: assets/projects/zooxr/explorer-thumb.webp
              width: 1280
              height: 720
              thumbnailWidth: 640
              alt: {en: First-person Quest view through a wooden gate towards a dog standing on sand, zh: Quest 第一人称视角，透过木栏门可以看到站在沙地上的狗}
              caption:
                en: From the gate, the visitor can see a dog inside the enclosure and the fences of other enclosures in the distance.
                zh: 从门边望进去，能看到围栏里的一只狗，远处还有其他围栏。
            - src: assets/projects/zooxr/feeding.webp
              thumbnail: assets/projects/zooxr/feeding-thumb.webp
              width: 1280
              height: 720
              thumbnailWidth: 640
              alt:
                en: A dog approaches food held by the visitor in VR
                zh: VR 画面中，一只狗靠近游客手里的食物
              caption:
                en: Inside the enclosure, the visitor holds food out to the dog.
                zh: 进到围区后，游客把手里的食物递向狗。
    featuredVideo:
      youtubeId: cUG-zWmE-2E
      watchUrl: https://www.youtube.com/watch?v=cUG-zWmE-2E
      embedUrl: https://www.youtube-nocookie.com/embed/cUG-zWmE-2E
      poster: assets/projects/zooxr/explorer.webp
      width: 1280
      height: 720
      caption:
        en: Full course demo, from laying out the zoo in AR to visiting the enclosures in VR. If YouTube is unavailable, the walkthrough above covers both devices in stills.
        zh: 完整课程演示记录了从 AR 搭建到 VR 入园的过程。如果无法播放 YouTube，可以通过上方的实机图和园区地图看完整个流程。
    sectionOrder: [background, process, video, credits]
    credits:
      - title: {en: Course project screenshots, zh: 课程项目截图}
        body: {en: Captured by Hao Chen. The deer and dog models are from Animals FREE by ithappy., zh: 截图由 Hao Chen 提供。鹿和狗的模型出自 ithappy 的 Animals FREE 素材包。}

  - id: meeting-transcribe
    published: true
    name: {en: Meeting Transcribe — LLM Transcription and Minutes Pipeline, zh: Meeting Transcribe（大模型转录与纪要流程）}
    date: {en: 'Jun 2026 – Oct 2026', zh: '2026年6月 – 2026年10月'}
    region: ny
    type: personal
    tech: Python, uv, Claude Code, Codex
    keywords: [LLM, transcription, agent skill, audio, 录音, 转录, 纪要]
    summary:
      en: An agent skill that turns meeting, lecture, and interview recordings into original-language transcripts and minutes.
      zh: 一套将会议、课程和访谈录音整理成原语言转录稿与纪要的 Agent Skill。
    background:
      en: I designed the workflow and output formats and worked with a coding agent to set the review states and thresholds. I designed the model-selection experiments and verified the results. Coding agents wrote most of the code and ran the experiments.
      zh: 我设计了工作流程和输出格式，与编程 Agent 一起确定复核状态和判断阈值，也负责设计模型选型实验并核验结果。主要代码和实验执行由编程 Agent 完成。
    work: []
    journey:
      - title: {en: Choosing a model for formal transcription, zh: 正式转录的模型选型}
        body:
          en: I evaluated candidates for the transcription task, then chose the lowest-cost option that produced acceptable output.
          zh: 我先评估候选模型是否适合转录任务，再从输出效果可接受的选项中选成本最低的一个。
      - title: {en: What the structural checks measure, zh: 结构检查的判断依据}
        body:
          en: Each chunk is classified as usable-unverified, needs-review, or unusable. For example, an empty response is unusable.
          zh: 每段输出标为「可用但未经核实」（usable-unverified）、「需复核」（needs-review）或「不可用」（unusable）。例如，空输出会被判为不可用。
      - title: {en: A fabricated continuation, zh: 一段编造的后续对话}
        body:
          en: One chunk passed the structural checks even though it invented dialogue after the audio ended. I spotted the anomaly by comparing the output length with a cheaper reference transcript and the neighboring chunks. The revised prompt added a stop rule for each audio slice and supplied vocabulary as an unordered list.
          zh: 有一段转录通过了结构检查，却在录音结束后编出了后续对话。我将输出长度与低成本参照转录和相邻片段对照，才发现异常。修改后的提示词为每个音频片段加入停止规则，并改用无序词表。
      - title: {en: One skill for Claude Code and Codex, zh: 同一套 Skill 用于 Claude Code 和 Codex}
        body:
          en: Both agents use the same skill, with Python tools running in a uv-locked environment. I ran the installers on macOS and Windows.
          zh: 两个 Agent 共用同一套 Skill，Python 工具在由 uv 锁定依赖的环境中运行。我在 macOS 和 Windows 上都运行过安装器。
    gallery:
      - group: product
        src: assets/projects/meeting-transcribe/sample-transcript.webp
        thumbnail: assets/projects/meeting-transcribe/sample-transcript-thumb.webp
        width: 1510
        height: 528
        thumbnailWidth: 640
        alt:
          en: "Transcript of a synthetic exchange about taking photographs"
          zh: "合成摄影对话转录稿中的两段发言"
        caption:
          en: "In this 17-second synthetic recording the speakers agree to meet at the library entrance at ten on Saturday and photograph the reading room if it rains. The text shown is the transcriber’s normalized output."
          zh: "这段约 17 秒的合成录音中，两人约定周六十点在图书馆入口碰面，下雨就改拍阅览室。图中是转录工具整理输出的原文。"
      - group: product
        src: assets/projects/meeting-transcribe/sample-check.webp
        thumbnail: assets/projects/meeting-transcribe/sample-check-thumb.webp
        width: 1510
        height: 868
        thumbnailWidth: 640
        alt:
          en: "Selected response and structural-check fields for the same sample"
          zh: "同一次样例请求返回的状态与结构检查字段"
        caption:
          en: "The transcription request returned HTTP 200. The checker found two speakers and no structural warnings. Its usable_unverified status leaves content verification to a reader. This run covered transcription, parsing and checks."
          zh: "同次转录请求返回 HTTP 200，检查识别到两个说话人，没有结构告警。usable_unverified 表示文本可用，内容仍待人工核实。本次实测覆盖转录、解析和检查。"
    sectionOrder: [workflow, background, product, journey]

  - id: dance-xr
    published: true
    name: {en: Dance XR — VR Dance Practice System, zh: Dance XR（VR 舞蹈练习系统）}
    date: {en: Apr 2026 – May 2026 · Columbia University team project · COMS W4172, zh: 2026年4月 – 2026年5月 · 哥伦比亚大学团队项目 · COMS W4172}
    members:
      - name: {en: Yihe An, zh: Yihe An}
        url: https://github.com/YihAn011
      - name: {en: Hao Chen, zh: Hao Chen}
        url: https://github.com/JarrettChen217
      - name: {en: Hiroyuki Akiyama, zh: Hiroyuki Akiyama}
        url: https://github.com/Hi-ak
      - name: {en: John Mitnik, zh: John Mitnik}
        url: https://github.com/johnmitnik2
    region: ny
    type: team
    tech: Unity 6.3.6f1, C#, Meta XR SDK, OpenXR, Meta Quest 3, SteamVR, HTC Vive Tracker, UDP, JSON, RenderTexture
    keywords: [VR, Unity, Meta Quest 3, Vive Tracker, UDP, C#, virtual reality, 虚拟现实, 舞蹈]
    summary:
      en: An immersive dance-practice prototype for Meta Quest 3 that combines floor-based step guidance, rhythm scoring, a configurable minimap, and optional Vive Tracker ankle tracking.
      zh: 面向 Meta Quest 3 的沉浸式舞蹈练习原型，通过地面脚步引导、节奏评分、可配置小地图与可选的 Vive Tracker 脚踝追踪帮助用户按自己的节奏练习。
    background:
      en: Dance XR explores how a standalone VR experience can provide spatial step guidance and playback control without requiring learners to keep watching an instructor. Users choose a style, difficulty and song, then follow virtual footprints while viewing score and position feedback. A floating control panel provides playback, discrete speed changes, footprint scaling, and minimap or camera options.
      zh: Dance XR 探索如何让一套独立运行的 VR 体验在不要求用户持续注视真人教练的情况下，提供空间脚步引导与练习节奏控制。用户可选择舞种、难度与歌曲，再跟随虚拟脚印练习，并查看得分与位置反馈。悬浮控制面板提供播放控制、离散倍速调整、脚印大小设置，以及小地图与相机模式切换。
    workHeading: {en: My contribution, zh: 我的贡献}
    work:
      - en: Led the initial project architecture and Unity 6.3 / Meta XR scaffolding, then maintained core application state and integration work.
        zh: 主导项目初期架构与 Unity 6.3 / Meta XR 工程搭建，并持续维护核心应用状态与系统集成。
      - en: Implemented the floating interaction menu and minimap system, including top-down rendering, drag and two-hand scaling, foot markers, follow/orientation modes, and camera controls.
        zh: 实现悬浮交互菜单与小地图系统，包括俯视渲染、拖动与双手缩放、双脚标记、跟随/朝向模式和相机控制。
      - en: 'Built the Quest-side Vive Tracker receiver and calibration pipeline: packet decoding, receiver states, two-point yaw-and-translation calibration, foot binding, telemetry, and lost-tracking warnings.'
        zh: 实现 Quest 端 Vive Tracker 接收与校准管线，包括数据包解析、接收状态机、双点偏航角与平移校准、左右脚绑定、遥测及丢失追踪提示。
      - en: Supported repeated merges, device builds, and integration fixes as the prototype iterated toward the final demonstration.
        zh: 在原型迭代至最终演示的过程中承担多次合并、设备构建与集成修复。
    journey:
      - title: {en: A practice flow that stays in the learner’s space, zh: 让练习始终发生在用户的空间中}
        body:
          en: The session starts with a choice of dance style, difficulty and song. During practice, floor footprints provide the next spatial cue while score and position feedback remain available without asking the learner to follow a continuously visible instructor.
          zh: 练习从选择舞种、难度与歌曲开始。过程中，地面虚拟脚印提供下一步的空间提示，得分与位置反馈也始终可见，用户无需持续注视真人教练。
      - title: {en: Controls that adapt the routine to the learner, zh: 让用户按自己的节奏调整练习}
        body:
          en: The floating panel brings playback controls, discrete speed choices, footprint scaling, and minimap or camera modes into reach. The minimap adds a top-down view of the practice space and foot positions without displacing the primary guidance.
          zh: 悬浮面板将播放控制、离散倍速选择、脚印缩放，以及小地图或相机模式集中在可触及的位置。小地图以俯视图呈现练习空间与双脚位置，同时不干扰主要引导。
      - title: {en: AI-assisted development, grounded in device integration, zh: 大量使用 AI 工具，但核心仍是设备集成}
        body:
          en: This was a project where I used AI tools extensively for Unity experimentation and presentation work. The essential work remained adapting suggestions to the existing project, connecting unfamiliar VR packages and hardware, and iterating on real devices until the demonstration worked.
          zh: 这是我首次在 Unity 实验与演示材料制作中大量使用 AI 工具的项目。关键工作仍然是将建议适配到已有工程，连接陌生的 VR 软件包与硬件，并在真实设备上持续迭代直至完成演示。
    architecture:
      - title: {en: Vive ankle trackers, zh: Vive 脚踝追踪器}
        body:
          en: HTC Vive Trackers mounted at the ankles provide the optional foot-pose input for the practice experience.
          zh: 佩戴在脚踝上的 HTC Vive Tracker 为练习体验提供可选的脚部姿态输入。
      - title: {en: Windows companion to local network packets, zh: Windows 伴随应用到局域网数据包}
        body:
          en: A companion Unity application on Windows reads tracker poses through SteamVR and sends them over the local network as UDP/JSON packets.
          zh: Windows 上运行的伴随 Unity 应用通过 SteamVR 读取追踪器姿态，并以 UDP/JSON 数据包通过局域网发送。
      - title: {en: Quest receiver, calibration and foot anchors, zh: Quest 接收、校准与脚部锚点}
        body:
          en: The Quest Unity application receives packets, calibrates the two coordinate spaces, binds left and right foot anchors, and handles stale or lost tracking states.
          zh: Quest Unity 应用接收数据包、校准两个坐标空间、绑定左右脚锚点，并处理追踪过期或丢失状态。
    gallery:
      - group: product
        src: assets/projects/dance-xr/dance-xr-minimap-controls-1600.webp
        thumbnail: assets/projects/dance-xr/dance-xr-minimap-controls-800.webp
        width: 1600
        height: 900
        thumbnailWidth: 800
        alt: {en: In-headset minimap with score, music speed and footprint-size controls, zh: 头显内的小地图、得分、音乐速度与脚印大小控制}
        caption:
          en: The in-headset view combines a configurable minimap and score feedback with controls for music speed and footprint size.
          zh: 头显内视图将可配置小地图与得分反馈结合，并提供音乐速度和脚印大小控制。
      - group: product
        src: assets/projects/dance-xr/dance-xr-session-menu-1600.webp
        thumbnail: assets/projects/dance-xr/dance-xr-session-menu-800.webp
        width: 1600
        height: 900
        thumbnailWidth: 800
        alt: {en: Dance XR session menu for style, difficulty, song and calibration choices, zh: 用于选择舞种、难度、歌曲与校准的 Dance XR 练习菜单}
        caption:
          en: The session menu gathers style, difficulty, song and calibration choices before a practice run begins.
          zh: 练习开始前，菜单集中呈现舞种、难度、歌曲与校准选项。
      - group: engineering
        src: assets/projects/dance-xr/dance-xr-vive-trackers-1600.webp
        thumbnail: assets/projects/dance-xr/dance-xr-vive-trackers-800.webp
        width: 1600
        height: 1200
        thumbnailWidth: 800
        alt: {en: Two HTC Vive Trackers with ankle straps, zh: 两个配有脚踝绑带的 HTC Vive Tracker}
        caption:
          en: Optional ankle-mounted Vive Trackers supplied the foot-pose input carried through the companion and Quest applications.
          zh: 可选的脚踝 Vive Tracker 提供脚部姿态输入，并由伴随应用传递至 Quest 应用。
      - group: engineering
