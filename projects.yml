        zh: 实现用户、帖子与内容搜索相关的前后端流程。
      - en: Integrated image generation behind provider interfaces; the current repository includes OpenAI and Gemini implementations and related tests.
        zh: 通过服务接口接入图像生成；当前仓库包含 OpenAI、Gemini 实现及相关测试。
      - en: Maintained a Docker Compose development stack and Google Cloud deployment configuration.
        zh: 维护 Docker Compose 开发环境与 Google Cloud 部署配置。

  - id: online-ordering
    published: true
    name: {en: Online Food Ordering, zh: Online Food Ordering（在线订餐系统）}
    date: {en: 'Dec 2025 – Feb 2026', zh: '2025年12月 – 2026年2月'}
    region: ny
    type: personal
    tech: Java, Spring Boot, React, PostgreSQL, Spring Security, Docker
    keywords: [backend, REST, SQL, 订餐, 后端]
    summary:
      en: A restaurant and ordering application with a React client and a layered Java backend.
      zh: 使用 React 客户端与分层 Java 后端的餐厅浏览及订餐应用。
    background:
      en: The application connects restaurant and menu browsing to customer and cart services. The backend separates controllers, services, and data access around a PostgreSQL database.
      zh: 应用将餐厅、菜单浏览与客户及购物车服务连接起来。后端围绕 PostgreSQL 数据库分离控制器、服务与数据访问。
    work:
      - en: Implemented Spring Boot endpoints for customer, restaurant, menu, and cart workflows.
        zh: 使用 Spring Boot 实现客户、餐厅、菜单与购物车流程接口。
      - en: Used Spring Data JDBC for persistence and Spring Security for session-based authentication.
        zh: 使用 Spring Data JDBC 实现持久化，以 Spring Security 实现会话认证。
      - en: Integrated the React interface and prepared Docker application configuration.
        zh: 集成 React 界面并配置应用 Docker 环境。

  - id: vitalguard
    published: true
    name: {en: VitalGuard AI, zh: VitalGuard AI（可穿戴传感系统）}
    date: {en: 'Sep 2025 – Dec 2025', zh: '2025年9月 – 2025年12月'}
    region: ny
    type: academic
    tech: ESP32, MicroPython, Python, Flask, Google Cloud, Gunicorn
    keywords: [IoT, wearable, hardware, 物联网, 可穿戴]
    summary:
      en: A university AIoT prototype connecting wearable sensor readings to a cloud service and web dashboard.
      zh: 将可穿戴传感器读数连接到云服务与 Web 仪表板的大学 AIoT 原型项目。
    background:
      en: The team project investigates a device-to-cloud workflow for sensor collection, processing, visualisation, and generated reports. Its repository separates embedded firmware, the Flask service, and the project website.
      zh: 团队项目探索设备到云端的传感采集、处理、可视化及报告生成流程，仓库分别组织嵌入式固件、Flask 服务与项目网站。
    work:
      - en: Worked on the ESP32-to-Flask data pipeline and cloud backend.
        zh: 参与 ESP32 到 Flask 的数据管道与云端后端工作。
      - en: Configured backend serving and process management with Gunicorn and systemd.
        zh: 使用 Gunicorn 与 systemd 配置后端服务及进程管理。
