          en: JaCoCo summary reporting 66 percent instruction coverage and 65 percent branch coverage for the final project configuration.
          zh: JaCoCo 汇总显示最终项目配置的 66% 指令覆盖率与 65% 分支覆盖率。
        caption:
          en: 'Final-report JaCoCo result: 66% instruction and 65% branch coverage; this portfolio pass did not rerun the experiment.'
          zh: 最终报告记录的 JaCoCo 结果：66% 指令覆盖率、65% 分支覆盖率；本次作品集整理未重新运行实验。
    links:
      - label: {en: Code, zh: 代码}
        url: https://github.com/chai-yinfeng/Mine-Automation-System
    boundary:
      en: The final report recorded 66% instruction coverage and 65% branch coverage across the project. These results describe structural reachability in that reported experiment, not a proof of whole-system deadlock freedom or exhaustive schedule exploration.
      zh: 最终报告记录了项目整体 66% 的指令覆盖率和 65% 的分支覆盖率。这些结果描述的是该次实验中的结构可达性，不代表已证明整个系统无死锁，也不代表穷尽了所有调度交错。

