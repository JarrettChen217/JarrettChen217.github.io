  - id: autonomous-delivery
    published: true
    name: {en: Autonomous Delivery App, zh: 自主配送应用}
    date: {en: 'Mar 2026 – Apr 2026', zh: '2026年3月 – 2026年4月'}
    region: ny
    type: academic
    tech: React, TypeScript, Google Places, Google Maps, Java, Spring Boot, Spring Security, Spring Data JDBC, PostgreSQL, Docker Compose, nginx
    keywords: [address autocomplete, delivery tracking, JWT, team lead, 地址自动补全, 配送追踪, 队长]
    summary:
      en: I led a nine-person course team developing an app for placing and tracking delivery orders.
      zh: 我担任九人课程项目团队的队长，带领团队开发用于下单和追踪配送的应用。
    background:
      en: The course app modeled a San Francisco delivery service. Customers could choose a delivery center, enter a drop-off address and parcel details, and follow a simulated robot or drone delivery.
      zh: 这个课程项目模拟了旧金山的配送服务。用户可以选择配送站，填写送达地址和包裹信息，再查看模拟机器人或无人机的配送进度。
    boundary:
      en: The browser demo lets you choose a fixed sample address and advance tracking by hand on a schematic map. It runs locally with preset data. Sign-in, order submission, and server-driven tracking are part of the course app described below.
      zh: 网页演示使用预设数据，可选择一个示例地址，并在示意地图上手动推进配送状态。演示在浏览器本地运行。下文的登录、订单提交和服务端模拟追踪属于课程应用。
    process:
      kicker: {en: Course team workflow, zh: 课程团队应用流程}
      heading: {en: From sign-in to delivery, zh: 从登录到送达}
      intro:
        en: Follow an order from the browser to the server and back through the customer screens.
        zh: 沿着用户操作流程，看一笔订单如何在浏览器、服务端和数据库之间流转。
      stages:
        - id: sign-in
          label: {en: Account, zh: 账户}
          title: {en: Register or sign in, zh: 注册或登录}
          body:
            en: New customers complete a verification-code step to register. At sign-in, Spring Boot checks the password against the saved hash for that email address or phone number and issues a JSON Web Token (JWT). The browser keeps the token for the session and sends it with later requests. A Spring Security filter verifies the token and makes the user identity available to controllers without keeping a server-side session.
            zh: 新用户通过验证码步骤完成注册。登录时，Spring Boot 根据邮箱或手机号查找账户，比对密码与已存储的哈希值，通过后签发 JSON Web Token（JWT）。浏览器在当前会话内保留令牌，并随后续请求发送。Spring Security 过滤器验证令牌，将用户身份交给控制器，无需在服务端保存会话。
        - id: order
          label: {en: Addresses and parcels, zh: 地址与包裹}
          title: {en: Enter the delivery details, zh: 填写配送信息}
          body:
            en: The customer picks a delivery center and selects a drop-off suggestion from Google Places within the San Francisco search bounds. The order wizard sends the selected coordinates to Spring Boot. The backend checks the drop-off against the service area, creates the order in PostgreSQL, and accepts a separate request to save the parcel details against that order.
            zh: 用户选择配送站，再从 Google Places 限定在旧金山范围内的建议中选择送达地址。下单页面把选中的坐标传给 Spring Boot。后端确认送达点位于服务区内，在 PostgreSQL 中创建订单，并通过另一条请求把包裹信息关联到该订单。
          gallery:
            - src: assets/projects/autonomous-delivery/places-suggestions.webp
              thumbnail: assets/projects/autonomous-delivery/places-suggestions-thumb.webp
              width: 650
              height: 615
              thumbnailWidth: 640
              alt:
                en: "Google Places lists the museum, its library and a nearby garage in the drop-off field."
                zh: "送达地址栏中的 Google Places 候选列表包括美术馆、图书馆和附近的停车场。"
              caption:
                en: "In the original React app, typing “San Francisco Museum of Modern Art” brings up live suggestions. The first result is the museum itself."
                zh: "在原版 React 应用里输入 San Francisco Museum of Modern Art，Google Places 返回实时建议，第一项就是美术馆本身。"
            - src: assets/projects/autonomous-delivery/places-selection.webp
              thumbnail: assets/projects/autonomous-delivery/places-selection-thumb.webp
              width: 650
              height: 538
              thumbnailWidth: 640
              alt:
                en: "Selected museum address with latitude and longitude beneath the field."
                zh: "选中的美术馆地址，下方显示经纬度。"
              caption:
                en: "Selecting the museum fills in its formatted address. The coordinates below the field are the point the order page can pass to the backend."
                zh: "选中美术馆后，输入框填入完整地址，下方显示经纬度，订单页面可以把这个点传给后端。"
        - id: confirmation
          label: {en: Vehicle and review, zh: 车型与订单核对}
          title: {en: Choose an option and confirm the order, zh: 选择配送方式并确认订单}
          body:
            en: The recommendations screen checks vehicle availability at the selected center and presents robot and drone options. The customer chooses an option, reviews the order summary, and goes through checkout. The confirmation screen links to tracking for that order.
            zh: 推荐页面查看所选配送站的车辆可用情况，并显示机器人和无人机选项。用户选择配送方式、核对订单摘要并完成结账步骤。确认页面提供该订单的追踪入口。
        - id: tracking
          label: {en: Tracking, zh: 追踪}
          title: {en: Follow a simulated delivery, zh: 查看模拟配送进度}
          body:
            en: The tracking screen requests updates every three seconds. The backend checks that the order belongs to the signed-in customer, advances the vehicle’s simulated position, and returns the status and coordinates. Google Maps shows the center, vehicle, and destination, with a straight dashed line from the center to the destination. Polling stops when the order is delivered.
            zh: 追踪页面每三秒请求一次更新。后端确认订单属于当前登录用户，推进车辆的模拟位置，并返回配送状态和坐标。Google Maps 显示配送站、车辆和送达点，用一条虚线直接连接配送站和送达点。订单送达后，页面停止轮询。
          gallery:
            - src: assets/projects/autonomous-delivery/maps-tracking.webp
              thumbnail: assets/projects/autonomous-delivery/maps-tracking-thumb.webp
              width: 1052
              height: 356
              thumbnailWidth: 640
              alt:
                en: "Google Maps shows a green pickup center, blue simulated robot, red museum destination and dashed center-to-destination line."
                zh: "Google 地图上，绿色为配送站，蓝色为模拟机器人，红色为美术馆目的地；虚线连接配送站和目的地。"
              caption:
                en: "A local test order has the same museum as its destination. The original tracking page polls Spring Boot for the simulated vehicle position. The dashed line connects the endpoints directly."
                zh: "本地示例订单使用同一座美术馆作为目的地。原版追踪页轮询 Spring Boot 获取模拟车辆的位置；虚线直接连接配送站和目的地。"
        - id: order-history
          label: {en: History, zh: 历史记录}
          title: {en: Reopen an order, zh: 查看历史订单}
          body:
            en: Order history retrieves the customer’s orders from the backend. From the list, the customer can reopen tracking for an active delivery or view details for a delivered order. A separate profile screen displays and updates account information.
            zh: 历史订单页面从后端读取当前用户的订单。用户可以从列表继续追踪配送中的订单，也可以查看已送达订单的详情。个人资料页面提供独立的账户信息查看和编辑入口。
    architectureIntro:
      en: For the local course demo, Docker Compose ran the frontend, backend, and PostgreSQL together. nginx served the React build and forwarded API requests to Spring Boot under the same origin.
      zh: 课程演示通过 Docker Compose 在本地一起运行前端、后端和 PostgreSQL。nginx 提供 React 构建产物，并将同源 API 请求转发给 Spring Boot。
    architecture:
      - title: {en: 'Browser · React and TypeScript', zh: 浏览器 · React 与 TypeScript}
        body:
          en: React Router organizes the screens. The TypeScript client sends HTTP requests to the backend. Google Places suggests addresses and Google Maps draws the tracking view.
          zh: React Router 组织各个页面，TypeScript 客户端通过 HTTP 请求与后端通信。Google Places 提供地址建议，Google Maps 绘制配送追踪视图。
      - title: {en: 'Server · Spring Boot and Spring Security', zh: 服务端 · Spring Boot 与 Spring Security}
        body:
          en: Java controllers handle account, order, and tracking requests. Spring Security provides the request’s authenticated identity. Order and tracking handlers check ownership before returning the customer’s data.
          zh: Java 控制器处理账户、订单和配送追踪请求。Spring Security 提供当前请求的认证身份，订单和追踪接口确认归属后再返回用户数据。
      - title: {en: 'Database · PostgreSQL and Spring Data JDBC', zh: 数据库 · PostgreSQL 与 Spring Data JDBC}
        body:
          en: Spring Data JDBC repositories read and write PostgreSQL. Foreign keys link orders to customers and delivery centers and link parcels to orders. The order’s JSONB tracking field stores structured data such as the drop-off coordinates.
          zh: Spring Data JDBC 仓储层读写 PostgreSQL。外键将订单关联到用户和配送站，将包裹关联到订单。订单的 JSONB 追踪字段保存送达点坐标等结构化数据。
    workHeading: {en: My contributions, zh: 我的贡献}
    work:
      - en: I built the React and TypeScript address input with Google Places suggestions bounded to the delivery area. On the team’s Google Maps tracking page, I added the delivery markers, dashed line, and initial map framing.
        zh: 我用 React 和 TypeScript 实现了地址输入组件，将 Google Places 的建议限制在配送范围内。我还在团队的 Google Maps 追踪页面加入配送标记、虚线连线和初始视野调整。
      - en: I migrated the existing JWT authentication in the Spring Boot backend to Spring Security.
        zh: 我将 Spring Boot 后端已有的 JWT 认证迁移到 Spring Security。
      - en: As team lead, I turned proposed features into backlog items with acceptance criteria, planned sprints, and merged teammates’ pull requests.
        zh: 作为队长，我把拟议功能整理成带有验收标准的待办事项，制定迭代计划，并合并队友的拉取请求。
    journeyHeading: {en: What I learned from integration, zh: 我的联调经验}
    journey:
      - title: {en: Keep field names consistent at the API boundary, zh: 在 API 边界统一字段名}
        body:
          en: The order history screen expected camelCase fields in snake_case responses, and the profile screen sent an update field with the wrong name. I aligned the TypeScript API types and both screens with the backend’s field names.
          zh: 订单历史页面按 camelCase 读取后端的 snake_case 响应，个人资料页面提交更新时也用错了一个字段名。我让 TypeScript API 类型和这两个页面都使用与后端一致的字段名。
      - title: {en: Keep live data separate from the map viewport, zh: 将位置更新与地图视野分开}
        body:
          en: On first load, I fit the map to the delivery points so the pickup and drop-off were both visible. Later polls update the vehicle location while preserving the customer’s map view.
          zh: 我让地图首次加载时自动调整视野，同时显示取件点和送达点。后续轮询会更新车辆位置，同时保留用户调整过的地图视野。
    play:
      url: play/autonomous-delivery/index.html
      label: {en: Try the delivery demo, zh: 体验配送演示}
    links:
      - label: {en: Course team repository, zh: 课程团队仓库}
        url: https://github.com/qhuang258/DDMA-team
      - label: {en: Address autocomplete source, zh: 地址自动补全源码}
        url: https://github.com/qhuang258/DDMA-team/blob/8813ad895ad14b156235b4994b8e38ad7433e4e8/frontend/src/components/AddressAutocomplete.tsx
      - label: {en: Tracking page source, zh: 配送追踪页面源码}
        url: https://github.com/qhuang258/DDMA-team/blob/8813ad895ad14b156235b4994b8e38ad7433e4e8/frontend/src/pages/tracking/TrackingPage.tsx
      - label: {en: Spring Security configuration, zh: Spring Security 配置}
        url: https://github.com/qhuang258/DDMA-team/blob/8813ad895ad14b156235b4994b8e38ad7433e4e8/backend/DeliveryManagement/src/main/java/com/laioffer/deliverymanagement/config/SecurityConfig.java
    sectionOrder: [background, scope, architecture, process, contributions, journey, resources]

  - id: daisyworld
    published: true
    name: {en: 'DaisyWorld — Exploring Emergence', zh: 'DaisyWorld（探索涌现与环境反馈）'}
    date: {en: 'May 2025', zh: '2025年5月'}
    region: au
    type: academic
    members:
      - name: {en: Hao Chen, zh: Hao Chen}
        url: https://github.com/JarrettChen217
      - name: {en: Junhao Zhu, zh: Junhao Zhu}
        url: https://github.com/junhaozhu1
    tech: Python, Pygame, Jupyter Notebook, pandas
    keywords: [agent-based modelling, complex systems, emergence, environmental feedback, 多智能体建模, 复杂系统, 涌现, 环境反馈]
    summary:
      en: "A two-person Python reimplementation and extension of NetLogo's DaisyWorld for SWEN90004 Modelling Complex Software Systems, exploring how simple local rules can accumulate into system-level environmental feedback."
      zh: "墨尔本大学 SWEN90004“复杂软件系统建模”课程中的两人合作项目：用 Python 复现并扩展 NetLogo 的 DaisyWorld，探索简单的局部规则如何累积为系统层面的环境反馈。"
    background:
      en: "SWEN90004 framed the assignment as a modelling exercise: teams reimplemented a selected NetLogo grid model, investigated its behaviour, and proposed an extension. Our Python version separates parameter configuration, simulation control, Pygame rendering, and notebook-based data inspection; black and white daisies, bare soil, local temperature, reproduction, ageing, and heat diffusion interact on a toroidal grid. Ant-colony shortest-path examples offer a useful analogy for the course's complex-systems lens: simple local pheromone feedback can accumulate into a collective route. DaisyWorld does not simulate ants or route finding; its system-level patterns arise instead from vegetation, albedo, and temperature feedback. The extension adds pollution zones and spread, pollution-dependent behaviour and visual overlays, plus a Lucky Clover mutation and pollution-mitigation pathway. These are implemented mechanisms, not reported experimental results."
      zh: "SWEN90004 将作业设为一次建模练习：团队复现一个指定的 NetLogo 网格模型，考察其行为，并提出扩展。我们的 Python 版本分离了参数配置、仿真控制、Pygame 渲染与基于 notebook 的数据检查；黑、白雏菊、裸地、局部温度、繁殖、衰老与热扩散在环形网格中通过局部规则互动。蚂蚁群体寻找最短路径是理解这门课复杂系统视角的一个类比：简单的局部信息素反馈能够累积成群体路线。DaisyWorld 不模拟蚂蚁或路径寻优；它的系统层面模式来自植被、反照率与温度之间的反馈。扩展代码加入污染区域及其传播、受污染影响的行为与可视化覆盖层，以及 Lucky Clover 的变异和污染缓解路径。这些是已实现的机制，不是实验结果报告。"
    work:
      - en: Built and refined core Python model infrastructure, including parameter configuration, the grid-patch abstraction, toroidal-neighbour handling, and temperature diffusion.
        zh: 搭建并完善 Python 模型的核心基础，包括参数配置、网格单元抽象、环形邻域处理和温度扩散。
      - en: Added the notebook-based data-inspection workflow and implemented substantial parts of the pollution/Lucky Clover extension, including pollution zones and spread, visual overlays, and pollution-dependent mutation and ageing behaviour.
        zh: 加入基于 notebook 的数据检查流程，并实现污染/Lucky Clover 扩展的重要部分，包括污染区域与传播、可视化覆盖层，以及受污染程度影响的变异和衰老逻辑。
    demo:
      src: assets/projects/daisyworld/daisyworld-extension-local-demo.mp4
      poster: assets/projects/daisyworld/daisyworld-extension-local-poster.webp
      width: 720
      height: 760
      caption:
        en: A fixed-seed local macOS/Pygame capture of the extension model's grid renderer. It is a functional demonstration, not an experimental result.
        zh: 使用固定随机种子录制的扩展模型本机 macOS/Pygame 网格渲染画面。该画面仅用于功能演示，不代表实验结果。

  - id: mini-spotify
    published: true
    name: {en: Mini Spotify, zh: Mini Spotify（Android 音乐客户端）}
    date: {en: 'Mar 2026 – Present', zh: '2026年3月 – 至今'}
    region: ny
    type: academic
    tech: Kotlin, Jetpack Compose, Room, Retrofit, ExoPlayer
    keywords: [Android, mobile, MVVM, 音乐, 移动端]
    summary:
      en: An Android music client exploring MVVM, local storage, and background playback.
      zh: 探索 MVVM、本地存储与后台播放的 Android 音乐客户端。
    background:
      en: A learning project connecting a mock media-catalogue API to a native mobile interface and playback components.
      zh: 将模拟媒体目录 API 连接到原生移动界面与播放组件的学习项目。
    work:
      - en: Used Kotlin, Compose, and MVVM to organise the interface and application state.
        zh: 使用 Kotlin、Compose 与 MVVM 组织界面及应用状态。
      - en: Integrated Room storage, Retrofit network access, and ExoPlayer playback.
        zh: 集成 Room 存储、Retrofit 网络访问与 ExoPlayer 播放。

  - id: java-concurrency
    published: true
    name: {en: Mine Automation Verification — Java Concurrency, zh: 矿山自动化验证 — Java 并发、JBMC 与 Jazzer}
    date: {en: 'Nov 2025 – Dec 2025', zh: '2025年11月 – 2025年12月'}
    region: ny
    type: academic
    tech: Java 17, Maven, JUnit 5, JBMC, Jazzer, JaCoCo
    keywords: [verification, testing, deadlock, token-controlled scheduling, Java concurrency, 并发, 死锁, 测试, 形式化验证]
    summary:
      en: A two-person formal-verification project that extended an existing Java mine automation simulation with bounded safety checks, coverage-guided fuzzing, and token-controlled scheduling to investigate concurrency bugs and improve the reproducibility of selected thread interleavings.
      zh: 一个两人合作的形式化验证项目：在既有 Java 矿山自动化并发模拟上，引入有界安全性检查、覆盖率引导模糊测试和 token 控制的线程调度，用于研究并发缺陷，并提升特定线程交错的可复现性。
    background:
      en: For Columbia CSEE W6863 in Fall 2025, the team extended an existing mine simulation in which carts move through an elevator and single-capacity stations. Under contention, carts and engines can enter circular-wait states; the project added verification and testing capability rather than rebuilding the simulator from scratch.
      zh: 在 Columbia CSEE W6863（2025年秋季）中，团队扩展了一个既有矿山模拟系统：矿车经过电梯和单容量站点。在资源竞争下，矿车与运输线程可能形成循环等待；项目重点是新增验证与测试能力，而非从零重建模拟器。
    members:
      - name: {en: Hao Chen, zh: Hao Chen}
        url: https://github.com/JarrettChen217
      - name: {en: Yinfeng Chai, zh: Yinfeng Chai}
        url: https://github.com/chai-yinfeng
    work:
      - en: Brought and adapted the mine simulation used as the verification subject from an earlier undergraduate course project.
        zh: 提供并改造此前本科课程项目中的矿山模拟系统，作为本项目的验证对象。
      - en: Led the core implementation and iterative debugging of the token-controlled scheduling extension.
        zh: 主导 token-controlled scheduling 扩展的核心实现与迭代调试。
      - en: Implemented or refined the injectable pause strategy, fuzz entry points, progress/deadlock monitoring, engine step granularity, and selected synchronization fixes.
        zh: 实现或完善可注入暂停策略、fuzz 入口、进度与死锁监测、引擎步骤粒度及部分同步修复。
      - en: Organized the repository and finalized architecture, fuzzing, and JBMC documentation.
        zh: 整理仓库结构，并完成架构、fuzzing 与 JBMC 文档。
    journey:
      - title: {en: From timing to explicit scheduling, zh: 从时序依赖到显式调度}
        body:
          en: The fuzz input selects which thread role may advance by one logical step. This made selected interleavings explicit and replayable instead of relying only on JVM timing.
          zh: fuzz 输入决定哪个线程角色可以推进一个逻辑步骤，使特定线程交错能够被明确控制与回放，而不只依赖 JVM 的时序随机性。
      - title: {en: Reach the missing intermediate states, zh: 到达此前遗漏的中间状态}
        body:
          en: Iteration hooks, a progress/deadlock watcher, and splitting the Engine receive/deliver transition into two controllable steps let the harness exercise states a coarser model missed.
          zh: 通过迭代 hook、进度与死锁监测，以及把 Engine 的 receive/deliver 转换拆成两个可控制步骤，测试框架能够覆盖较粗粒度模型遗漏的状态。
      - title: {en: Evaluate with bounded checks and concurrent exploration, zh: 结合有界检查与并发探索进行评估}
        body:
          en: JBMC harnesses checked bounded safety properties of deterministic components, while Jazzer explored liveness failures in the concurrent composition with a progress/deadlock oracle.
          zh: JBMC harness 检查确定性组件在有限边界内的安全性质；Jazzer 则结合进度与死锁 oracle 探索完整并发组合中的活性问题。
    architecture:
      - title: {en: JBMC bounded safety checks, zh: JBMC 有界安全性检查}
        body: {en: Harnesses target deterministic components and selected safety properties within explicit bounds., zh: Harness 针对确定性组件与选定安全性质进行有限边界内的检查。}
      - title: {en: Jazzer concurrency exploration, zh: Jazzer 并发探索}
        body: {en: Coverage-guided inputs drive the concurrent composition and expose selected liveness failures., zh: 覆盖率引导输入驱动完整并发组合，并暴露选定的活性故障。}
      - title: {en: Token-controlled scheduling, zh: Token 控制调度}
        body: {en: A gated controller releases a chosen thread role for one logical step while monitoring progress., zh: gated controller 每次释放指定线程角色推进一个逻辑步骤，并持续监测进度。}
    gallery:
      - src: assets/projects/java-concurrency/java-concurrency-token-controller-1600.webp
        thumbnail: assets/projects/java-concurrency/java-concurrency-token-controller-800.webp
        width: 1600
        height: 900
        thumbnailWidth: 800
        group: engineering
        alt:
          en: Fuzz input selects a thread token, and the controller opens one matching thread lane for a single iteration while other lanes wait.
          zh: fuzz 输入选择线程 token；控制器只为匹配的线程通道开放一次迭代，其他通道保持等待。
        caption:
          en: Token-controlled scheduling made selected interleavings explicit and replayable.
          zh: Token 控制调度让特定线程交错能够被明确控制与回放。
      - src: assets/projects/java-concurrency/java-concurrency-system-model-1600.webp
        thumbnail: assets/projects/java-concurrency/java-concurrency-system-model-800.webp
        width: 1600
        height: 976
        thumbnailWidth: 800
        group: engineering
        alt:
          en: Mine carts travel from an elevator through single-capacity stations connected by engine threads, then return to the elevator.
          zh: 矿车从电梯出发，经过由运输线程连接的单容量站点后返回电梯。
        caption:
          en: Mine workflow context for investigating circular-wait states under contention.
          zh: 用于研究资源竞争下循环等待状态的矿山工作流背景。
      - src: assets/projects/java-concurrency/java-concurrency-coverage-summary-1600.webp
        thumbnail: assets/projects/java-concurrency/java-concurrency-coverage-summary-800.webp
        width: 1600
        height: 341
        thumbnailWidth: 800
        group: engineering
