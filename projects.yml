    name: {en: SocialAI, zh: SocialAI（AI 社交平台）}
    date: {en: 'Dec 2025 – Mar 2026; subsequent maintenance', zh: '2025年12月 – 2026年3月；后续持续维护'}
    region: ny
    type: personal
    tech: React, Go, Elasticsearch, Google Cloud, Docker
    keywords: [search, full-stack, image generation, 搜索, 图像生成]
    summary:
      en: A full-stack social application combining searchable posts with AI-assisted image creation.
      zh: 将帖子搜索与 AI 辅助图像创作结合的全栈社交应用。
    background:
      en: SocialAI brings content creation and discovery together. Its React interface connects to a Go service, with Elasticsearch for search and cloud storage for uploaded media.
      zh: SocialAI 将内容创作与发现结合起来。React 界面连接 Go 服务，使用 Elasticsearch 搜索及云存储保存媒体。
    work:
