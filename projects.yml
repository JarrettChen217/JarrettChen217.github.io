  - id: mur-simulation
    published: true
    name: {en: 'ROS AI Vehicle — Simulation Infrastructure', zh: 'ROS AI 智能小车 — 仿真基础设施'}
    date: {en: 'Sep 2024 – Nov 2024', zh: '2024年9月 – 2024年11月'}
    region: au
    type: team
    team: {en: Mentored collaboration with Johnson Tong, zh: 与导师 Johnson Tong 协作}
    tech: ROS2, NVIDIA Isaac Sim, Python, OpenCV, RPyC
    keywords: [robotics, simulation, sensors, reinforcement learning, imitation learning, 机器人, 仿真, 强化学习, 模仿学习]
    summary:
      en: "Early ROS2 and Isaac Sim infrastructure for a competition-oriented AI vehicle: a simulated track, vehicle control, and sensor-data pathways for downstream learning research."
      zh: 面向比赛型 AI 智能小车的前期 ROS2 与 Isaac Sim 基础设施：包括仿真跑道、车辆控制，以及为下游学习研究准备的传感器数据通路。
    background:
      en: "I developed the simulation layer for a competition-oriented AI vehicle project: configuring a car-like four-wheel chassis in Isaac Sim, placing it on a track, and using ROS2 to connect movement commands with simulated sensor streams. Prior Unity experience helped me move quickly through the scene-building workflow."
      zh: 我为比赛型 AI 智能小车项目开发仿真层：在 Isaac Sim 中配置类似小车的四轮车架并将其放入跑道，再通过 ROS2 将运动指令与模拟传感器数据流连接起来。此前的 Unity 经验帮助我更快完成场景搭建流程。
    work:
      - en: Built the early Isaac Sim track and vehicle configuration, then enabled the ROS2 bridge for the simulation.
        zh: 搭建前期 Isaac Sim 跑道与车辆配置，并为仿真启用 ROS2 Bridge。
      - en: Developed Python ROS2 pathways for keyboard, game-controller, and RPC-based velocity control, plus simulated camera, LiDAR, and odometry data.
        zh: 开发键盘、手柄和基于 RPC 的速度控制 ROS2 通路，以及模拟相机、激光雷达和里程计数据通路。
      - en: Prepared simulated sensor signals for reinforcement-learning teammates to explore path recognition; game-controller driving was intended to collect behaviour examples for imitation-learning experiments.
        zh: 为强化学习团队准备模拟传感器信号，用于探索路径识别；手柄驾驶则计划用于采集行为示例，服务模仿学习实验。
    architecture:
      - title: {en: Isaac Sim vehicle and track, zh: Isaac Sim 车辆与跑道}
        body:
          en: A car-like four-wheel vehicle and cone-based track were configured in Isaac Sim as the simulation environment.
          zh: 在 Isaac Sim 中配置类似小车的四轮车辆与锥桶跑道，作为仿真环境。
      - title: {en: ROS 2 control and simulation bridge, zh: ROS 2 控制与仿真桥接}
        body:
          en: The ROS 2 Bridge connected simulation topics with velocity-control paths from keyboard, game-controller, and RPyC experiments.
          zh: ROS 2 Bridge 将仿真话题与键盘、手柄和 RPyC 实验中的速度控制通路连接起来。
      - title: {en: Simulated sensor data for downstream learning, zh: 面向下游学习的模拟传感器数据}
        body:
          en: Camera, LiDAR, and odometry pathways supplied simulated observations for downstream reinforcement- and imitation-learning exploration; this page does not claim a completed model result.
          zh: 相机、激光雷达和里程计通路为下游强化学习与模仿学习探索提供模拟观测；本页面不声称模型成果已经完成。
    gallery:
      - group: product
        src: assets/projects/mur-simulation/isaac-sim-ros2-bridge-racetrack-1600.webp
        thumbnail: assets/projects/mur-simulation/isaac-sim-ros2-bridge-racetrack-800.webp
        width: 1600
        height: 1120
        thumbnailWidth: 800
        alt: {en: A simulated four-wheel Jackal vehicle and cone-based track in Isaac Sim, with the ROS 2 Bridge enabled., zh: Isaac Sim 中的四轮 Jackal 车辆与锥桶跑道，ROS 2 Bridge 已启用。}
        caption:
          en: The Isaac Sim scene brought the vehicle, cone-based track, and ROS 2 bridge into one simulation workspace.
          zh: Isaac Sim 场景将车辆、锥桶跑道和 ROS 2 Bridge 汇集到同一仿真工作区。
      - group: engineering
        src: assets/projects/mur-simulation/ros2-camera-subscriber-simulated-track-1600.webp
        thumbnail: assets/projects/mur-simulation/ros2-camera-subscriber-simulated-track-800.webp
        width: 1600
        height: 900
        thumbnailWidth: 800
        alt: {en: A ROS 2 camera subscriber displays the simulated cone track beside the Python subscriber implementation., zh: ROS 2 相机订阅器显示模拟锥桶跑道，旁边为 Python 订阅器实现。}
        caption:
          en: The camera-subscriber path converts the simulated stereo-camera stream into a displayable frame while the project records odometry output.
          zh: 相机订阅通路将模拟立体相机流转换为可显示画面，同时项目记录里程计输出。
    demo:
      src: assets/projects/mur-simulation/ros2-sensor-twist-control-demo.mp4
      poster: assets/projects/mur-simulation/ros2-sensor-twist-control-poster-800.webp
      width: 2000
      height: 1600
      caption:
        en: Isaac Sim capture of the vehicle around cones alongside ROS 2 action-graph nodes and velocity-command output.
        zh: Isaac Sim 录屏展示车辆在锥桶间运行，并呈现 ROS 2 Action Graph 节点和速度指令输出。
    sectionOrder: [background, architecture, product, contributions, engineering, demo, resources, scope]
    links:
      - label: {en: Public source repository, zh: 公开源代码仓库}
        url: https://github.com/JarrettChen217/MURSports-ROS
    boundary:
      en: This case study covers simulation and ROS2 infrastructure only. Reinforcement/imitation-learning models, model convergence, autonomous driving, and race performance were downstream goals, not results claimed here. Hao collaborated under mentorship and was not a formal MUR Motorsports software-team member.
      zh: 本案例仅涵盖仿真与 ROS2 基础设施。强化/模仿学习模型、模型收敛、自动驾驶和比赛表现均为下游目标，并非本页面声称已实现的成果。Hao 在导师协作下参与项目，并非 MUR Motorsports 正式软件团队成员。

  - id: tetress
    published: true
    name: {en: 'Tetress — A* Search & MCTS Game Agent', zh: 'Tetress — A* 搜索与 MCTS 博弈智能体'}
    date: {en: 'March 2024 to May 2024 · University of Melbourne · COMP30024 Artificial Intelligence · Semester 1, 2024', zh: '2024年3月 – 2024年5月 · 墨尔本大学 · COMP30024 Artificial Intelligence · 2024年第一学期'}
    region: au
    type: academic
    team: {en: ByteBrainers, zh: ByteBrainers}
    members:
      - name: {en: Hao Chen, zh: Hao Chen}
        url: https://github.com/JarrettChen217
      - name: {en: Jiayi Sun, zh: Jiayi Sun}
        url: https://github.com/JiayiSun666
    tech: Python 3.12, NumPy, A*, priority queue, heuristic search, Monte Carlo Tree Search, UCB, self-play testing
    keywords: [AI, Tetress, A*, heuristic search, priority queue, Monte Carlo Tree Search, UCB, self-play, 搜索, 博弈, 启发式]
    summary:
      en: 'Co-developed a two-stage AI project for Tetress: A*-based heuristic planning for a single-player task, followed by an MCTS game agent with heuristic move ordering and adaptive time allocation.'
      zh: 与 Jiayi Sun 共同完成的两阶段 AI 项目：先以基于 A* 的启发式搜索规划单人任务，再构建结合启发式落子排序与动态时间分配的 MCTS 博弈智能体。
    background:
      en: Tetress is an 11×11 toroidal strategy game in which players place tetrominoes and completed rows or columns clear. This two-person University of Melbourne COMP30024 Artificial Intelligence project by ByteBrainers connected a planning task with adversarial play on the same game model.
      zh: Tetress 是一款基于 11×11 环面棋盘的策略游戏：玩家放置四格骨牌，填满的行或列会被清除。ByteBrainers 在墨尔本大学 COMP30024 Artificial Intelligence 课程中以两人合作的形式，在同一游戏模型上衔接了规划任务与对抗博弈。
    workHeading: {en: Collaboration & contribution, zh: 协作与贡献}
    work:
      - en: The overall project and reports were co-developed by Hao Chen and Jiayi Sun.
        zh: 项目整体及两份报告由 Hao Chen 与 Jiayi Sun 共同完成。
      - en: Hao's repository history covers tetromino representation, legal-action generation, priority-queue search, A* heuristic iterations, major MCTS stages, tree reuse, and time-management experiments.
        zh: Hao 的仓库记录覆盖四格骨牌表示、合法动作生成、优先队列搜索、A* 启发函数迭代、MCTS 核心阶段、树复用与时间管理实验。
      - en: Jiayi's recorded Part B work covers heuristic scoring, reducing self-elimination, opponent-mobility adjustments, and simulation-boost fixes.
        zh: Jiayi 记录在案的 Part B 工作涵盖启发式评分、减少自我淘汰、基于对手行动空间的调整，以及模拟加速修复。
    journey:
      - title: {en: 'Part A — Single-player heuristic search', zh: 'Part A — 单人启发式搜索'}
        body: {en: 'Generated legal tetromino placements and used a priority queue with an f(n)=g(n)+h(n)-style score. The A*-based heuristic estimated the pieces needed to reach and fill a target row or column, searching for a low-cost sequence that clears a designated target token.', zh: '生成合法四格骨牌落子，并以带有 f(n)=g(n)+h(n) 风格评分的优先队列进行搜索。基于 A* 的启发函数估计到达并填满目标行或列所需的棋子数，从而寻找清除指定目标格的低成本步骤序列。'}
      - title: {en: 'Part B — Two-player game agent', zh: 'Part B — 双人博弈智能体'}
        body: {en: 'Built a competitive agent around MCTS selection, expansion, random simulation/rollout and backpropagation, with UCB-guided node selection. Heuristic move ordering considered opponent mobility; a heuristic/greedy opening fallback handled large branching factors, while tree reuse and dynamic time allocation included a mid-game weighting strategy.', zh: '围绕 MCTS 的选择、扩展、随机模拟（rollout）与回传构建竞争型智能体，并使用 UCB 引导的节点选择。启发式落子排序纳入对手行动空间；在分支因子较大时采用启发式/Greedy 开局回退，并通过树复用与动态时间分配实施中局加权策略。'}
      - title: {en: 'Local self-play & course tournament', zh: '本地自对弈与课程锦标赛'}
        body: {en: 'Compared multiple local self-play variants and participated in the course tournament environment; no course leaderboard rank is claimed.', zh: '比较多个本地自对弈版本，并参加课程 tournament 环境；不声明任何课程排行榜名次。'}
    gallery:
      - group: engineering
        src: assets/projects/tetress/tetress-astar-reach-heuristic.webp
        thumbnail: assets/projects/tetress/tetress-astar-reach-heuristic-180.webp
        width: 362
        height: 391
