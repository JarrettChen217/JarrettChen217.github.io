  - id: midas-curse-unity
    published: true
    name: {en: 'Midas Curse — Unity Survival Game', zh: 'Midas Curse（Unity 生存游戏）'}
    date: {en: 'Aug 2023 – early Nov 2023', zh: '2023年8月 – 2023年11月初'}
    region: au
    type: team
    team: {en: Cosmic Creators, zh: Cosmic Creators}
    members:
      - {name: Hao Chen, github: 'https://github.com/JarrettChen217'}
      - {name: Chao Ma, github: 'https://github.com/cmcbrm'}
      - {name: Gaoyongle Zhang, github: 'https://github.com/XinMoZ'}
      - {name: Jiayi Sun, github: 'https://github.com/JiayiSun666'}
    tech: Unity, C#, ShaderLab, Git
    keywords: [Unity, game development, survival game, shaders, animation, Blend Tree, 游戏开发, 生存游戏, 动画]
    summary:
      en: A third-person maze, combat, and survival game built around a Midas-inspired golden-path mechanic.
      zh: 以 Midas 神话为灵感、围绕黄金路径机制展开的第三人称迷宫战斗与生存游戏。
    background:
      en: Project 1 established the concept and an initial playable prototype; Project 2 developed the same game into a fuller two-stage experience with a maze, enemies, skills, a shop, visual effects, and a boss encounter. This was my first experience with Unity and the starting point for systematically learning Unity, shader concepts, and game development through practice.
      zh: Project 1 建立游戏概念与初步可玩原型，Project 2 则在同一作品上继续开发，形成包含迷宫、敌人、技能、商店、视觉效果与 Boss 战的两阶段体验。这是我第一次接触 Unity，也是我通过实践系统学习 Unity、Shader 概念与游戏开发的起点。
    mechanics:
      heading: {en: How the game works, zh: 游戏机制}
      intro:
        en: >-
          Every movement rewrites the arena: the golden path left behind can defeat
          enemies, but stepping onto it again also brings the curse closer to completion.
        zh: 玩家每一次移动都会重塑战场：身后留下的黄金路径能够击败敌人，但自己再次踏上它，也会让诅咒更接近完成。
      steps:
        - id: create-path
          title: {en: Leave a golden path, zh: 留下黄金路径}
          body:
            en: >-
              As the Mage moves through the maze, traversed floor tiles turn into gold.
              Route choice therefore keeps changing the available safe space and the
              positions from which later encounters can be approached.
            zh: 法师在迷宫中移动时，走过的地面会逐格转化为黄金。路线选择因此会持续改变可用的安全空间，以及后续战斗可以展开的位置。
        - id: manage-curse
          title: {en: Manage the curse, zh: 控制黄金化风险}
          body:
            en: >-
              Both the player and enemies are slowed on active gold while their
              Goldenate meter—the game's measure of the curse—continues to rise. If the
              player's meter fills, the Mage turns completely to gold and the run ends.
            zh: 玩家与敌人站在已激活的黄金地面上都会减速，并持续累积 Goldenate（黄金化）数值。玩家的计量条满后，法师会完全黄金化，本局游戏随之结束。
        - id: turn-danger
          title: {en: Turn danger into offence, zh: 化陷阱为攻击}
          body:
            en: >-
              Careful routing can lure enemies onto the same trail. Filling an enemy's
              Goldenate meter defeats it and awards coins, while crystals gathered in
              the maze provide another resource for later upgrades.
            zh: 玩家可以规划路线，将敌人引到同一条黄金路径上；敌人的 Goldenate 条满后即被击败并掉落金币，迷宫中收集的水晶也能为后续升级提供资源。
        - id: reshape-field
          title: {en: Reshape the battlefield, zh: 用神器重塑战场}
          body:
            en: >-
              Two artifact loadouts provide skills that create, remove, or chain-react
              with golden ground, including area-clearing ultimate abilities. Shop
              upgrades improve armour, movement speed, skill damage, cooldown, range,
              and ultimate charging.
            zh: 两套神器技能可以生成、移除或连锁引爆黄金地面，并通过范围型终极技能清出空间；商店升级涵盖护甲、移动速度、技能伤害、冷却、作用范围与终极技能充能。
    process:
      heading: {en: Engineering the Midas Curse, zh: 构建 Midas Curse 核心机制}
      intro:
        en: >-
          In 2023, before generative-AI coding assistants were part of our workflow,
          Cosmic Creators learned through Unity documentation, tutorials, prototypes,
          code review, and manual debugging. The result was not a single shader trick,
          but a connected system in which movement, ground state, combat, skills, and
          visual feedback all respond to the same golden-path mechanic.
        zh: 2023 年，生成式 AI 编程助手尚未进入我们的开发流程。Cosmic Creators 通过阅读 Unity 文档、研究教程、制作原型、相互审阅代码并手动调试推进开发。最终成果并非单一的 Shader 技巧，而是一套将移动、地面状态、战斗、技能与视觉反馈连接到同一黄金路径机制的系统。
      badge:
        src: assets/projects/midas-curse-unity/built-by-hand-2023.webp
        width: 760
        height: 240
        alt: {en: Built by hand in 2023, zh: 2023 年手工构建}
      stages:
        - id: concept
          label: {en: Concept, zh: 概念}
          title: {en: Turn a myth into a playable rule, zh: 把神话转化为可玩的规则}
          body:
            en: >-
              The team translated the Midas myth into a rule the player could feel:
              movement turns traversed ground into gold, while that same path becomes a
              resource, a combat surface, and a growing survival constraint. Project 1
              proved the rule in a playable prototype; Project 2 built the wider maze,
              skill, shop, enemy, and boss loop around it.
            zh: 团队将 Midas 神话转化为玩家能够直接感受到的规则：移动会把经过的地面变成黄金，而同一条路径既是资源与战斗区域，也会逐渐成为生存限制。Project 1 先以可玩原型验证规则，Project 2 再围绕它扩展迷宫、技能、商店、敌人与 Boss 战循环。
          contribution:
            en: I contributed to early concept and prototype documentation, then worked on player movement, animation integration, interaction feedback, and later scene debugging.
            zh: 我参与早期概念与原型文档，并在后续开发中负责或参与玩家移动、动画集成、交互反馈及场景调试。

        - id: system-model
          label: {en: System model, zh: 系统建模}
          title: {en: Represent the floor as an interactive grid, zh: 将地面表示为可交互网格}
          body:
            en: >-
              The golden ground is a gameplay system rather than a painted trail.
              GoldManager maps world positions into a two-dimensional grid and uses
              raycasts to create cells only where valid floor geometry exists. As the
              player moves, GoldWalk identifies the corresponding cell and activates
              the tile, giving the rest of the game one consistent spatial model.
            zh: 黄金地面并不是一条简单绘制的轨迹，而是一套玩法系统。GoldManager 将世界坐标映射到二维网格，并通过射线检测只在有效地面上创建单元格；玩家移动时，GoldWalk 找到对应单元并激活地块，让游戏中的其他机制共享同一套空间模型。
          findings:
            - {en: World coordinates resolve to stable grid cells., zh: 世界坐标被映射为稳定的网格单元。}
            - {en: Raycasts prevent gold from appearing off the walkable floor., zh: 射线检测避免黄金出现在不可行走区域。}
            - {en: Movement becomes the shared input for path, combat, and skills., zh: 移动成为路径、战斗与技能系统的共同输入。}

        - id: state-logic
          label: {en: State logic, zh: 状态逻辑}
          title: {en: Give every gold tile a lifecycle, zh: 为每块黄金地面建立生命周期}
          body:
            en: >-
              Each GoldInfo cell progresses through inactive, expanding, active, and
              dissolving states. Timers distinguish natural expiry from forced removal,
              material changes expose the transition visually, and nearby systems can
              query or remove gold for attacks, particles, and ultimate-charge behaviour.
              This lifecycle turns a visual trail into reusable game state.
            zh: 每个 GoldInfo 地块都会依次经历未激活、扩张、激活与消散状态。计时逻辑区分自然到期与强制移除，材质切换把状态变化呈现出来；周边系统还能查询或移除黄金地块，用于攻击、粒子效果与终极技能充能。由此，视觉轨迹被转化为可复用的游戏状态。
          findings:
            - {en: One tile state drives both rules and visual feedback., zh: 同一地块状态同时驱动玩法规则与视觉反馈。}
            - {en: Natural and forced dissolves support different interactions., zh: 自然消散与强制移除支持不同交互。}
            - {en: Range queries connect the path to skills and combat., zh: 范围查询把黄金路径连接到技能与战斗。}

        - id: shader-feedback
          label: {en: Shader feedback, zh: Shader 反馈}
          title: {en: Make system state readable in motion, zh: 用 Shader 呈现系统状态}
          body:
            en: >-
              The team studied documented examples and tutorials, then adapted them to
              the game's state model. GoldExpanding receives a world-space start point,
              current time, and expansion speed; comparing travelled distance with
              elapsed time reveals the gold effect outward from its origin. A separate
              dissolve treatment and material switching communicate when transformed
              ground or affected objects leave the active state.
            zh: 团队先研究文档示例与教程，再把方法适配到游戏的状态模型中。GoldExpanding 接收世界空间起点、当前时间与扩张速度，并比较传播距离和经过时间，让黄金效果从起点向外展开；另一套消散效果与材质切换，则用来表达已转化地面或受影响物体离开激活状态的过程。
          findings:
            - {en: _StartPos anchors the effect in world space., zh: _StartPos 将效果锚定在世界空间。}
            - {en: Time and speed control the visible expansion boundary., zh: 时间与速度共同控制可见的扩张边界。}
            - {en: Material transitions keep gameplay state legible while moving., zh: 材质过渡让玩家在移动中仍能读懂玩法状态。}

        - id: browser-delivery
          label: {en: Browser delivery, zh: 浏览器交付}
          title: {en: Adapt the effect for WebGL, zh: 为 WebGL 调整视觉实现}
          body:
            en: >-
              A geometry-shader experiment produced a stronger local death effect, but
              the browser target required a WebGL-compatible path. The team therefore
              retained the underlying dissolve idea while adapting the implementation
              for the final build, then verified the complete game loop in the exported
              browser version. The decision kept the visual intent while making the
              project directly playable online.
            zh: 几何 Shader 实验在本地实现了更强的死亡效果，但浏览器目标需要兼容 WebGL 的实现路径。团队因此保留消散效果的核心思路，同时为最终构建调整实现，并在导出的浏览器版本中验证完整游戏循环，在保留视觉意图的同时让作品能够直接在线试玩。
          contribution:
            en: I prototyped the geometry-shader enemy-death effect and contributed to later integration and debugging as the team prepared the browser build.
            zh: 我制作了敌人死亡的几何 Shader 原型，并在团队准备浏览器构建时参与后续集成与调试。
    work:
      - en: Implemented and refined player movement and animation integration, including running states and Blend Tree adjustments.
        zh: 实现并完善玩家移动与动画集成，包括跑步状态及 Blend Tree 调整。
      - en: Worked on player-facing feedback and interaction flows, including health awareness, pause and shop controls, camera sensitivity, and audio behaviour.
        zh: 参与玩家反馈与交互流程开发，包括生命值提示、暂停与商店控制、镜头灵敏度及音频行为。
      - en: Contributed enemy spawning and animation adjustments, scene integration, and implementation debugging across the later development stage.
        zh: 在后续开发阶段参与敌人生成与动画调整、场景集成及实现调试。
    featuredVideo:
      youtubeId: _KGzpyql4ps
      watchUrl: https://www.youtube.com/watch?v=_KGzpyql4ps
