    tech: Java, Spring Boot, React, PostgreSQL, Spring Security, Docker
    keywords: [backend, REST, SQL, 订餐, 后端]
    summary:
      en: A restaurant and ordering application with a React client and a layered Java backend.
      zh: 使用 React 客户端与分层 Java 后端的餐厅浏览及订餐应用。
    background:
      en: The application connects restaurant and menu browsing to customer and cart services. The backend separates controllers, services, and data access around a PostgreSQL database.
      zh: 应用将餐厅、菜单浏览与客户及购物车服务连接起来。后端围绕 PostgreSQL 数据库分离控制器、服务与数据访问。
    work:
      - en: Implemented Spring Boot endpoints for customer, restaurant, menu, and cart workflows.
        zh: 使用 Spring Boot 实现客户、餐厅、菜单与购物车流程接口。
      - en: Used Spring Data JDBC for persistence and Spring Security for session-based authentication.
        zh: 使用 Spring Data JDBC 实现持久化，以 Spring Security 实现会话认证。
