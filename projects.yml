          zh: AVL 算法与伪代码开发的 Jira 任务列表
        caption:
          en: Jira records connect algorithm and pseudocode work to task ownership and status, including code folding, rotation updates and integration refinements.
          zh: Jira 记录将算法与伪代码开发关联到负责人和任务状态，涵盖代码折叠、旋转更新与集成完善。
