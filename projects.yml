# Edit all project content here. Run npm run build after saving.
# published:false excludes a draft from the generated browser data.
# Never put secrets or private source documents in this public-repo file.
# links: [{label: {en: Code, zh: 代码}, url: https://...}] is optional.
projects:
  - id: agent-ai
    published: true
    name: {en: Agent AI, zh: Agent AI（文档问答助手）}
    date: {en: '2026 — ongoing', zh: '2026年 — 持续开发'}
    region: ny
    type: personal
    tech: React, Node.js, LangChain, MCP, SerpAPI
    keywords: [RAG, AI agent, 文档问答, 语音, retrieval]
    summary:
      en: A conversational application presenting document-based answers alongside answers informed by web search.
      zh: 分别展示基于文档及网络搜索回答的对话应用。
    background:
      en: The project explores two information sources in one interface. Uploaded PDFs provide local context, while a separate MCP search tool retrieves current web information. The two answer streams remain visible separately.
      zh: 项目在同一界面中探索两类信息来源：上传 PDF 提供本地上下文，独立 MCP 搜索工具获取网络信息，两种回答分别展示。
    work:
      - en: Built the React interface and Express endpoints for PDF uploads and questions.
        zh: 构建 React 界面及处理 PDF 上传与问题的 Express 接口。
      - en: Loaded and split PDF text, embedded the chunks into an in-memory vector store, and used retrieved text as context for answering.
        zh: 加载并切分 PDF 文本，将文本块嵌入内存向量存储，使用检索文本作为回答上下文。
      - en: Connected a reusable MCP client to a SerpAPI search server and added speech recognition and text-to-speech interaction.
        zh: 将可复用 MCP 客户端连接到 SerpAPI 搜索服务，并加入语音识别与文字转语音交互。
    boundary:
      en: The current prototype uses a shared uploaded-file path and rebuilds its document embeddings during a question request. Public multi-user access and source citations are not yet implemented.
      zh: 当前原型共享上传文件路径，并在问答请求中重新构建文档嵌入，尚未实现公共多用户访问及来源引用展示。

